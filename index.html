    --ill-ink: #33201C;
    --ill-brow: #66361F;
    --ill-line: #355640;
    --ok: #2E7044;
    --hit-text: #526A4F;
    --qr-dark: #26302A;
    --qr-light: #FFFFFF;
    --scrim: rgba(38,48,42,.55);
    --shadow: 0 6px 24px rgba(38,48,42,.06);
    --press: rgba(38,48,42,.04);
  }
  /* Тема детского центра: зелёный #12774A и золото #C2A25A (макет B) — собирает tools/brand.js (kidsTheme) */
  :root[data-theme="brand"] {
    --bg: #FAF8F2;
    --surface: #FFFFFF;
    --surface-2: #F2EEE3;
    --text: #16251E;
    --text-2: #55625C;
    --accent: #B28F42;
    --accent-strong: #12774A;
    --on-accent: #FFFFFF;
    --gold: #C2A25A;
    --line: #E7DECB;
    --ill-fill: rgba(194,162,90,.18);
    --ill-bg: #F4E9D2;
    --ill-hair-dark: #B7794A;
    --ill-hair-mid: #D39A63;
    --ill-hair-light: #FBD58E;
    --ill-skin: #F6CDB0;
    --ill-berry: #EE8A7A;
    --ill-gold: #F2C14E;
    --ill-metal: #D5DAE2;
    --ill-aqua: #97D6BA;
    --ill-ink: #33413A;
    --ill-brow: #6A3820;
    --ill-line: #2E4237;
    --ill-k: .9;
    --wa: #25D366;
    --ok: #12774A;
    --hit-text: #8C640B;
    --qr-dark: #16251E;
    --qr-light: #FFFFFF;
    --scrim: rgba(22,37,30,.55);
    --shadow: 0 1px 2px rgba(22,37,30,.06), 0 6px 18px rgba(22,37,30,.06);
    --press: rgba(22,37,30,.04);
    --radius: 18px;
    --radius-sm: 12px;
    --font-head: "Nunito K", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: "Nunito K", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: light;
    --d1-bg: #E9EFF8;
    --d1-text: #22466F;
    --d1-ill: #D5E2F2;
    --d2-bg: #E6F2E9;
    --d2-text: #1F5634;
    --d2-ill: #D0E8D7;
    --d3-bg: #F8E8EC;
    --d3-text: #7C2843;
    --d3-ill: #F1D3DB;
    --d4-bg: #FBF0DC;
    --d4-text: #6E450A;
    --d4-ill: #F5E1BC;
    --ill-sky: #8DBDE8;
    --ill-white: #FFFFFF;
    --hero-bg: #12774A;
    --hero-text: #FFFFFF;
    --hero-text-2: #DEEBE5;
    --status-bg: #194D35;
    --status-text: #BCE6D3;
    --hero-accent: #DABF81;
    --hero-accent-text: #F1E6CE;
    --hero-slogan: #F2E6CA;
    --logo-bg: #F8F5EC;
    --logo-gold: #9B7D39;
    --hero-btn-text: #07311E;
    --badge-bg: #F9EFD7;
    --gold-text: #8C640B;
    --badge-text: #8C640B;
  }

  /* ─────────── Основа ─────────── */
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font-body);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p { margin: 0; }
  a { color: inherit; }
  a, button { -webkit-tap-highlight-color: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-x: clip;
  }
  .screen { flex: 1; display: flex; flex-direction: column; }

  /* ─────────── Иллюстрации ─────────── */
  .ill { background: var(--surface-2); border-radius: var(--radius-sm); overflow: hidden; }
  .ill svg { display: block; width: 100%; height: 100%; }
  .ill-tile { aspect-ratio: 200 / 140; border-radius: 0; }
  .ill-big { aspect-ratio: 200 / 140; border-radius: var(--radius); }
  .ill-hero { aspect-ratio: 200 / 140; border-radius: 0; }
  .ill-mini { width: 48px; height: 48px; flex: none; }
  .ill-big, .ill-hero { width: 100%; max-height: 45vh; } /* в горизонтальной ориентации — ниже, но во всю ширину */
  /* Мини 48px: рисунок увеличен до квадрата (видна середина x 30–170), линии толще */
  .ill-mini svg { width: 143%; margin-left: -21.5%; }
  .ill-mini { --sw: 3.4; }
  .ill-big, .ill-hero { --sw: 1.3; }
  /* Готовые картинки (растровые иллюстрации): заполняют рамку; в 48px — кадр по точке фокуса */
  .ill .ilr { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); }
  .ill-mini .ilr { object-position: var(--focus, 50% 50%); transform: scale(var(--zoom, 1)); transform-origin: var(--focus, 50% 50%); }

  /* Классы рисунков: линии и заливки только через переменные (палитра --ill-* своя в каждой теме) */
  .il .lc, .il .lh, .il .lo, .il .lg, .il .la {
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .il .lc, .il .lh, .il .lo { stroke-width: calc(var(--sw, 1.6) * var(--ill-k, 1)); }
  .il .lg, .il .la { stroke-width: var(--sw, 1.6); }
  .il .lc { stroke: var(--ill-line); }
  .il .lh { stroke: var(--ill-hair-light); }
  .il .lo { stroke: var(--ill-gold); }
  .il .lg { stroke: var(--gold); }  /* логотип — в цветах темы */
  .il .la { stroke: var(--accent); }
  .il .c-bg { fill: var(--ill-bg); }
  .il .c-hd { fill: var(--ill-hair-dark); }
  .il .c-hm { fill: var(--ill-hair-mid); }
  .il .c-hl { fill: var(--ill-hair-light); }
  .il .c-sk { fill: var(--ill-skin); }
  .il .c-be { fill: var(--ill-berry); }
  .il .c-go { fill: var(--ill-gold); }
  .il .c-mt { fill: var(--ill-metal); }
  .il .c-aq { fill: var(--ill-aqua); }
  .il .c-ik { fill: var(--ill-ink); }
  .il .c-br { fill: var(--ill-brow); }
  .il .fl { fill: var(--ill-fill); }
  .il .fs { fill: var(--accent-strong); }
  .il .fg { fill: var(--gold); }
  .il .fw { fill: var(--surface); }

  /* Прорисовка в карточке услуги: линии рисуются, затем проявляется заливка.
     Конечное состояние = обычный вид, поэтому без анимации картинка видна сразу. */
  .draw .il path { animation: ill-fill .5s .75s var(--ease) backwards; }
  .draw .il .lc, .draw .il .lh, .draw .il .lo {
    animation: ill-draw .9s var(--ease) backwards, ill-fill .5s .75s var(--ease) backwards;
  }
  @keyframes ill-draw {
    from { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
    to { stroke-dasharray: 1 2; stroke-dashoffset: 0; }
  }
  @keyframes ill-fill { from { fill-opacity: 0; } }
  /* Картинка вместо прорисовки мягко проявляется */
  .draw .ilr { animation: fadeIn .8s var(--ease) backwards; }

  /* ─────────── Главная: шапка ─────────── */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    flex: none; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--accent-strong);
    cursor: pointer; transition: transform .2s var(--ease), background-color .2s var(--ease);
  }
  .icon-btn .ico { width: 22px; height: 22px; }
  .icon-btn:active { transform: scale(.94); background: var(--surface-2); }
  .lang {
    display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .lang button {
    min-width: 48px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-2); font: 600 13px/1 var(--font-body); letter-spacing: .06em; cursor: pointer;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  .lang button[aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); }

  .hero { position: relative; text-align: center; padding: 0 0 20px; }
  .hero-top { position: relative; display: flex; justify-content: center; align-items: center; height: 96px; }
  .sprig { position: absolute; top: 2px; width: 92px; height: 92px; opacity: .55; }
  .sprig-l { left: 0; }
  .sprig-r { right: 0; transform: scaleX(-1); }
  .sprig path { fill: none; stroke: var(--gold); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .sprig .leaf { fill: var(--ill-fill); stroke: var(--accent); }
  .mono { width: 76px; height: 76px; color: var(--accent-strong); }
  .mono svg { display: block; width: 100%; height: 100%; }
  .salon { font: 600 30px/1.15 var(--font-head); letter-spacing: .01em; margin-top: 6px; }
  .hero .sub { color: var(--text-2); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
  .ornament { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto 14px; max-width: 220px; }
  .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .8; }
  .ornament span { width: 6px; height: 6px; border: 1px solid var(--gold); transform: rotate(45deg); }
  .addr { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .addr .ico { width: 16px; height: 16px; color: var(--accent-strong); }
  .status { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .status.is-open { color: var(--ok); }
  /* Статус — кнопка, раскрывает режим работы */
  .hours { margin-top: 2px; }
  .hours .status {
    display: inline-flex; min-height: 44px; margin: 0; padding: 0 12px; border: 0; border-radius: 22px;
    background: none; font-family: inherit; line-height: 1.3; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .hours .status .chev-down { width: 16px; height: 16px; margin-left: -2px; transition: transform .2s var(--ease); }
  .hours .status[aria-expanded="true"] .chev-down { transform: rotate(180deg); }
  .hours-panel {
    max-width: 320px; margin: 4px auto 0; padding: 14px 16px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); animation: fadeIn .2s var(--ease);
  }
  .hours-panel h2, .hours-panel h3 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin-bottom: 6px; }
  .hours-panel h3 { margin-top: 12px; }
  .hours-panel ul { list-style: none; padding: 0; }
  .hours-panel li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 8px; margin: 0 -8px; border-radius: 8px; font-size: 15px; }
  .hours-panel li.is-today { background: var(--surface-2); font-weight: 600; }
  .hours-panel .dtime { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .hours-panel .off { color: var(--text-2); }
  .hours-panel .brk { font-size: 13px; font-weight: 400; color: var(--text-2); }
  .hours-panel li.is-today .brk, .hours-panel li.is-today .off { color: var(--text); } /* --text-2 на --surface-2 ниже AA */

  /* Быстрые действия */
  .actions { display: flex; justify-content: center; gap: 20px; padding: 4px 0 24px; }
  .action {
    display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 72px;
    text-decoration: none; font-size: 13px; color: var(--text-2);
  }
  .action .circle {
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--accent-strong); box-shadow: var(--shadow);
    transition: transform .2s var(--ease), background-color .2s var(--ease);
  }
  .action .circle.wa { color: var(--wa); }
  .action:active .circle { transform: scale(.94); background: var(--surface-2); }

  /* Поиск */
  .search {
    position: relative; display: flex; align-items: center; margin: 0 0 24px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow);
    transition: border-color .2s var(--ease);
  }
  .search:focus-within { border-color: var(--accent); }
  .search > .ico { position: absolute; left: 14px; width: 20px; height: 20px; color: var(--text-2); pointer-events: none; }
  .search input {
    flex: 1; min-width: 0; height: 48px; padding: 0 4px 0 44px; border: 0; background: transparent;
    color: var(--text); font: 16px/1.2 var(--font-body); -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--text-2); opacity: 1; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search input:focus-visible { outline: none; }
  .search-clear {
    flex: none; width: 44px; height: 44px; margin-right: 2px; border: 0; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center; background: transparent; color: var(--text-2); cursor: pointer;
  }
  .search-clear[hidden] { display: none; }
  .search-clear .ico { width: 20px; height: 20px; stroke-width: 1.8; }
  .search-clear:active { background: var(--press); }
  .row .cat { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .empty { text-align: center; color: var(--text-2); padding: 24px 0 32px; }
  .empty:empty { padding: 0; }

  /* Категории */
  .section-title { font: 600 26px/1.2 var(--font-head); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cat-card {
    position: relative; display: flex; flex-direction: column; text-decoration: none; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    transition: transform .18s var(--ease);
  }
  .cat-card:active { transform: scale(.97); }
  .cat-card .body { padding: 10px 12px 14px; }
  .cat-card .name { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .cat-card .count { color: var(--text-2); font-size: 13px; margin-top: 4px; }

  /* Акции: пилюли «−20%» и «Акция», лента на главной, цены со старой зачёркнутой */
  .promo-badge, .promo-tag {
    display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--accent-strong); color: var(--on-accent);
    font-size: 12px; font-weight: 600; line-height: 1.4; letter-spacing: .02em; white-space: nowrap;
  }
  .cat-card > .promo-tag, .promo-card > .promo-badge { position: absolute; top: 8px; left: 8px; }
  .old { color: var(--text-2); font-weight: 400; text-decoration: line-through; }
  .price .new, .price .old { display: block; }
  .price .new { color: var(--accent-strong); }
  .price .old { font-size: 13px; }
  .promos { margin-bottom: 24px; }
  .promo-strip {
    display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: thin;
    margin: 0 -16px; padding: 2px 16px 12px;
  }
  .promo-card {
    position: relative; flex: 0 0 148px; scroll-snap-align: start; display: flex; flex-direction: column;
    text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); transition: transform .18s var(--ease);
  }
  .promo-card:active { transform: scale(.97); }
  .promo-card .body { flex: 1; display: flex; flex-direction: column; padding: 10px 12px 12px; }
  .promo-card .name { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .promo-card .price { margin-top: auto; padding-top: 6px; font-weight: 600; font-size: 15px; }

  /* Подвал */
  .footer {
    margin-top: auto; padding: 32px 0 calc(24px + env(safe-area-inset-bottom));
    text-align: center; color: var(--text-2); font-size: 13px;
  }
  .footer .ornament { margin: 0 auto 16px; }
  .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .footer .disclaimer { max-width: 340px; }
  .insta {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px;
    color: var(--accent-strong); text-decoration: none; font-weight: 600;
  }
  .insta .ico { width: 20px; height: 20px; }
  .copy { font-size: 12px; letter-spacing: .04em; }

  /* ─────────── Категория и услуга ─────────── */
  .back {
    display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: 8px 0 4px -6px; padding-right: 12px;
    text-decoration: none; color: var(--accent-strong); font-weight: 600; font-size: 15px; align-self: flex-start;
  }
  .back .ico { width: 22px; height: 22px; stroke-width: 1.8; }
  .screen-head { margin: 4px 0 20px; }
  .screen-head .ill-big { margin-bottom: 16px; }
  .screen-head h1 { font: 600 26px/1.2 var(--font-head); }
  .screen-head .from { color: var(--accent-strong); font-weight: 600; margin-top: 4px; }

  .list {
    list-style: none; margin: 0 0 32px; padding: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }
  /* Раздел внутри категории: заголовок над своим списком */
  .group-title { font: 600 20px/1.25 var(--font-head); font-variant-numeric: lining-nums; margin: 0 0 10px; }
  .list + .group-title { margin-top: -8px; }
  .row {
    display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 10px 12px 12px;
    text-decoration: none; transition: background-color .15s var(--ease);
  }
  .row:active { background: var(--press); }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-size: 15px; line-height: 1.3; }
  .meta { color: var(--text-2); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .row .meta { margin-top: 4px; }
  .dur { display: inline-flex; align-items: center; gap: 4px; }
  .dur .ico { width: 14px; height: 14px; stroke-width: 1.8; }
  .row .price { font-weight: 600; text-align: right; font-size: 15px; max-width: 42%; }
  .row .chev { width: 18px; height: 18px; color: var(--text-2); stroke-width: 1.8; }
  .hit {
    display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--hit-text);
    font-size: 12px; font-weight: 600; line-height: 1.4; letter-spacing: .02em;
  }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); margin: 4px 0 24px;
  }
  .card-body { padding: 20px 20px 24px; }
  .card h1 { font: 600 26px/1.2 var(--font-head); }
  .price-big { font: 600 30px/1.2 var(--font-head); color: var(--accent-strong); margin-top: 10px; }
  .price-promo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-top: 10px; }
  .price-promo .price-big { margin-top: 0; }
  .price-promo .old { font-size: 18px; }
  .promo-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 15px; }
  .promo-info .save { color: var(--accent-strong); font-weight: 600; }
  .card .meta { font-size: 15px; margin-top: 6px; }
  .card .dur .ico { width: 16px; height: 16px; }
  .card .desc { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .card h2 { font: 600 20px/1.25 var(--font-head); margin: 22px 0 10px; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { position: relative; padding: 5px 0 5px 32px; }
  .checks li::before {
    content: ""; position: absolute; left: 0; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2);
  }
  .checks li::after {
    content: ""; position: absolute; left: 6px; top: 13px; width: 8px; height: 4px;
    border-left: 1.6px solid var(--accent-strong); border-bottom: 1.6px solid var(--accent-strong); transform: rotate(-45deg);
  }
  /* Варианты цены: родные радиокнопки (клавиатура и подписи работают сами), вид — через переменные темы */
  .variants { border: 0; margin: 0; padding: 0; min-width: 0; }
  .variants legend {
    float: left; width: 100%; padding: 0; margin: 22px 0 2px;
    font: 600 20px/1.25 var(--font-head); font-variant-numeric: lining-nums;
  }
  .variants .hint { clear: both; color: var(--text-2); font-size: 13px; margin-bottom: 10px; }
  .opts { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .opt {
    display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; cursor: pointer;
    transition: background-color .15s var(--ease);
  }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt.is-checked { background: var(--surface-2); }
  .opt input {
    -webkit-appearance: none; appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
    border: 1.6px solid var(--text-2); border-radius: 50%; background: var(--surface);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .opt input::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-strong);
    transform: scale(0); transition: transform .15s var(--ease);
  }
  .opt input:checked { border-color: var(--accent-strong); }
  .opt input:checked::before { transform: scale(1); }
  .opt .vname { flex: 1; min-width: 0; }
  .opt .vprice { font-weight: 600; white-space: nowrap; }
  .screen-item { position: relative; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .screen-item .back { max-width: calc(100% - 52px); }
  .screen-item > .share-item { position: absolute; top: 8px; right: 0; }
  /* Уведомление «Ссылка скопирована» */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 30;
    max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 600; text-align: center; box-shadow: var(--shadow); pointer-events: none;
    opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .toast.is-above-bar { bottom: calc(96px + env(safe-area-inset-bottom)); }
  .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }
  /* Окно «QR-код» */
  .qr-modal {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: var(--scrim); animation: fadeIn .2s var(--ease) backwards;
  }
  .qr-dialog {
    display: flex; flex-direction: column; align-items: center; max-height: 100%; overflow-y: auto;
    padding: 6px 16px 20px; border-radius: var(--radius); background: var(--qr-light); color: var(--qr-dark);
    text-align: center; box-shadow: var(--shadow);
  }
  .qr-dialog .qr-close { align-self: flex-end; margin-right: -8px; border-color: transparent; background: transparent; color: var(--qr-dark); }
  .qr-dialog .qr-close:focus-visible { outline-color: var(--qr-dark); outline-offset: -4px; }
  .qr-box { width: min(80vw, 420px, calc(100vh - 170px)); min-width: 160px; aspect-ratio: 1; }
  .qr-box .qr { display: block; width: 100%; height: 100%; }
  .qr-bg { fill: var(--qr-light); }
  .qr-m { fill: var(--qr-dark); }
  .qr-name { font: 600 26px/1.2 var(--font-head); font-variant-numeric: lining-nums; margin-top: 6px; }
  .qr-hint { font-size: 15px; margin-top: 4px; }

  /* Кнопка записи — закреплена внизу окна, вне анимируемого экрана */
  .book-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 20px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(to top, var(--bg) 62%, transparent);
    pointer-events: none;
    animation: fadeIn .3s var(--ease) backwards;
  }
  .btn-book {
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 448px; min-height: 56px; margin: 0 auto;
    padding: 8px 20px; border-radius: 16px; background: var(--accent-strong); color: var(--on-accent);
    text-decoration: none; font-weight: 600; text-align: center; box-shadow: var(--shadow);
    transition: transform .18s var(--ease);
  }
  .btn-book:active { transform: scale(.98); }
  /* Есть онлайн-запись: вторая кнопка — WhatsApp (контурная) */
  .btn-wa {
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 448px; min-height: 48px; margin: 8px auto 0;
    padding: 6px 20px; border-radius: 16px; border: 1px solid var(--accent-strong); background: var(--surface); color: var(--accent-strong);
    text-decoration: none; font-weight: 600; text-align: center;
    transition: transform .18s var(--ease);
  }
  .btn-wa:active { transform: scale(.98); }
  .screen-item.has-booking { padding-bottom: calc(152px + env(safe-area-inset-bottom)); }
  .toast.is-above-bar.has-booking { bottom: calc(152px + env(safe-area-inset-bottom)); }

  /* Цифры одинаковой высоты: у шрифта заголовков по умолчанию старинные цифры.
     Стоит после правил с font:, потому что font: сбрасывает font-variant-numeric. */
  .salon, .section-title, .screen-head h1, .card h1, .card h2 { font-variant-numeric: lining-nums; }
  .num { font-variant-numeric: lining-nums tabular-nums; }

  /* ─────────── Без JavaScript (блок noscript вставляет сборка: tools/build.js) ─────────── */
  .nos {
    max-width: 480px; margin: 0 auto; text-align: center;
    padding: calc(32px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  }
  .nos .mono { margin: 0 auto; }
  .nos .salon { margin-top: 12px; }
  .nos p { color: var(--text-2); margin-top: 12px; }
  .nos-tel {
    display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px;
    font: 600 26px/1.2 var(--font-head); font-variant-numeric: lining-nums; color: var(--accent-strong); text-decoration: none;
  }
  .nos .btn-book { flex-direction: column; gap: 2px; margin-top: 8px; }
  .nos .btn-book span + span { font-weight: 400; font-size: 13px; opacity: .9; }

  /* ─────────── Анимации ─────────── */
  .enter-fwd { animation: inFwd .3s var(--ease) backwards; }
  .enter-back { animation: inBack .3s var(--ease) backwards; }
  .stagger { animation: rise .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 35ms + 60ms); }
  @keyframes inFwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .cat-card:active, .promo-card:active, .action:active .circle, .btn-book:active, .btn-wa:active, .icon-btn:active { transform: none; }
  }

  /* Узкие экраны (320px) */
  @media (max-width: 359px) {
    .sprig { width: 72px; height: 72px; }
    .actions { gap: 8px; }
    .cat-card .name { font-size: 14px; }
  }

/* ─────────── Детский центр (settings.type: "kids", этап 19.2) ───────────
     Вставляет сборка (tools/build.js, место KIDS_CSS), только у детских центров. Дизайн — макет B «Изумруд академиясы»
     (clients/juldyzdar/source/maket): тёмная шапка-«афиша» со звёздами, светлое содержимое, золотые рамки и звёзды;
     у кружков — цветные подложки своего направления (макет C). Шрифт — Nunito 600/800 (library/fonts, место FONT_FACE).
     Цвета — переменные: тема из зелёного и золота строит tools/brand.js (kidsTheme); ниже — значения по умолчанию
     (для тестовых сборок в темах noir / sage). */
  :root {
    --font-head: "Nunito K", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: "Nunito K", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --hero-bg: #0D3A26; --hero-text: #FFFFFF; --hero-text-2: #C9DDD0; --hero-accent: #E5C868; --hero-accent-text: #E5C868; --hero-btn-text: #0D2E1E;
    --hero-slogan: #F6EBC8; --logo-bg: #FBF6E9; --logo-gold: #8F7029;
    --status-bg: #1A4C35; --status-text: #BFE6CB;
    --badge-bg: #FBF1D3; --badge-text: #674D05; --gold-text: #765808;
    --d1-bg: #E9EFF8; --d1-text: #22466F; --d1-ill: #D5E2F2;
    --d2-bg: #E6F2E9; --d2-text: #1F5634; --d2-ill: #D0E8D7;
    --d3-bg: #F8E8EC; --d3-text: #7C2843; --d3-ill: #F1D3DB;
    --d4-bg: #FBF0DC; --d4-text: #6E450A; --d4-ill: #F5E1BC;
    --ill-sky: #8DBDE8; --ill-white: #FFFFFF;
  }
  body { font-weight: 600; }
  .kids button { font: inherit; color: inherit; }
  .t1 { --tile-bg: var(--d1-bg); --tile-text: var(--d1-text); --ill-bg: var(--d1-ill); }
  .t2 { --tile-bg: var(--d2-bg); --tile-text: var(--d2-text); --ill-bg: var(--d2-ill); }
  .t3 { --tile-bg: var(--d3-bg); --tile-text: var(--d3-text); --ill-bg: var(--d3-ill); }
  .t4 { --tile-bg: var(--d4-bg); --tile-text: var(--d4-text); --ill-bg: var(--d4-ill); }

  /* Рисунки кружков: свои цвета детского набора (классы c-wh, c-sky; текст «ABC»), звёздочки — золотые */
  .il .c-wh { fill: var(--ill-white); }
  .il .c-sky { fill: var(--ill-sky); }
  .il .tx { font-family: var(--font-head); font-weight: 800; }
  .ill.kpic { background: var(--tile-bg, var(--surface-2)); }
  /* Кружок без рисунка — иконка направления на цветной подложке */
  .kicon-art { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--tile-text, var(--accent-strong)); }
  .kicon-art .kic { width: 34%; height: auto; max-height: 56%; stroke-width: 1.5; }
  .ill-mini .kicon-art .kic { width: 60%; stroke-width: 1.9; }

  /* Логотип (assets/logo.svg салона: полая звезда с хвостом) — тёмное золото на кремовом круге с тонкой каймой (как у оригинала) */
  .kl-bg { fill: var(--logo-bg); }
  .kl-ring { fill: none; stroke: var(--logo-gold); stroke-width: 2; }
  .kl-star, .kl-tail { fill: var(--logo-gold); stroke: var(--logo-gold); stroke-width: 1.6; stroke-linejoin: round; }

  .kic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .kdemo { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--badge-bg); color: var(--badge-text); }

  /* ── шапка: во всю ширину окна, вплотную к верху, скруглён только низ; содержимое — в колонке #app (480 px) ──
     --kpad — расстояние от края окна до колонки; чтобы шапку не обрезало, по ширине обрезается страница, а не #app */
  html, body { overflow-x: hidden; overflow-x: clip; }
  #app { overflow-x: visible; }
  .khero {
    --kpad: max(16px, env(safe-area-inset-left), calc(50vw - 224px));
    position: relative; overflow: hidden; text-align: left; margin: 0 calc(-1 * var(--kpad)); color: var(--hero-text); background: var(--hero-bg);
    margin-top: calc(-1 * env(safe-area-inset-top)); padding: calc(14px + env(safe-area-inset-top)) var(--kpad) 16px; border-radius: 0 0 26px 26px;
  }
  .khero > *:not(.ksky) { position: relative; z-index: 1; }
  .ksky { position: absolute; top: 0; bottom: 0; left: calc(var(--kpad) - 16px); right: calc(var(--kpad) - 16px); width: auto; height: 100%; pointer-events: none; }
  .ksky path { fill: var(--gold); }
  .kbrand { display: flex; gap: 10px; align-items: center; padding-right: 92px; min-height: 68px; }
  .khero .mono { width: 68px; height: 68px; flex: none; }
  .kname { margin: 0; font: 800 17px/1.15 var(--font-head); letter-spacing: .08em; text-transform: uppercase; }
  .ksub { font-size: 12.5px; color: var(--hero-text-2); margin-top: 3px; line-height: 1.3; }
  .kslogan { font: 800 23px/1.12 var(--font-head); color: var(--hero-slogan); margin: 10px 0 8px; letter-spacing: -.01em; }
  .khero .lang { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: var(--kpad); z-index: 2; background: transparent; border: 1.5px solid var(--hero-text-2); }
  .khero .lang button { min-width: 40px; min-height: 32px; padding: 0 10px; color: var(--hero-text); font-weight: 800; font-family: var(--font-body); }
  .khero .lang button[aria-pressed="true"] { background: var(--hero-accent); color: var(--hero-btn-text); }
  .khero .hours { margin: 0; text-align: left; }
  .khero .hours .status {
    min-height: 32px; padding: 0 10px 0 9px; border-radius: 99px; background: var(--status-bg); color: var(--status-text);
    font-size: 13px; font-weight: 800; gap: 7px;
  }
  .khero .hours .status.is-closed, .khero .hours .status.is-break { color: var(--hero-text-2); }
  .khero .hours-panel { margin: 8px 0 0; color: var(--text); max-width: none; }
  .kacts { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .kact {
    display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 46px; padding: 0 4px; border-radius: 14px;
    text-decoration: none; font-weight: 800; font-size: 14px; color: var(--hero-text); background: var(--hero-bg);
    border: 1.5px solid var(--hero-text-2); min-width: 0;
  }
  .kact span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kact.main { background: var(--hero-accent); color: var(--hero-btn-text); border-color: transparent; }
  .kact .ico { width: 18px; height: 18px; stroke-width: 1.9; }

  /* ── секции ── */
  .ksec { margin-top: 20px; }
  .ksec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .ksec-head h2, .kh2 { font: 800 19px/1.2 var(--font-head); letter-spacing: -.01em; margin: 0; }
  .khint { color: var(--text-2); font-size: 13px; }

  /* ── чипы возраста ── */
  .kages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kage {
    position: relative; min-height: 52px; border-radius: 16px; background: var(--surface); color: var(--text); border: 1.5px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; cursor: pointer; padding: 4px;
  }
  .kage b { font-size: 20px; font-weight: 800; }
  .kage small { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .kage.adult b { font-size: 16px; }
  .kage[aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); border-color: var(--accent-strong); box-shadow: var(--shadow); }
  .kage[aria-pressed="true"] small { color: var(--on-accent); }
  .kage[aria-pressed="true"]::after {
    content: ""; position: absolute; top: -6px; right: -4px; width: 18px; height: 18px; background: var(--gold);
    clip-path: polygon(50% 0%, 61.8% 34.1%, 97.6% 34.5%, 69.4% 56.8%, 79.4% 90.5%, 50% 70%, 20.6% 90.5%, 30.6% 56.8%, 2.4% 34.5%, 38.2% 34.1%);
  }
  .kages.compact { display: flex; overflow-x: auto; gap: 6px; margin: 0 -16px; padding: 4px 16px 6px; scrollbar-width: none; }
  .kages.compact::-webkit-scrollbar { display: none; }
  .kages.compact .kage { flex: none; min-height: 40px; flex-direction: row; gap: 4px; padding: 0 12px; border-radius: 99px; }
  .kages.compact .kage b { font-size: 15px; }
  .kages.compact .kage small { margin: 0; }
  .kages.compact .kage.adult b { font-size: 14px; }

  /* ── баннер пробного занятия ── */
  .ktrial {
    position: relative; overflow: hidden; margin-top: 18px; padding: 14px 16px; border-radius: 20px;
    background: var(--badge-bg); color: var(--text); border: 1.5px solid var(--gold);
  }
  .ktrial h3 { margin: 0; font: 800 19px/1.15 var(--font-head); padding-right: 64px; }
  .ktrial p { margin: 3px 0 10px; color: var(--gold-text); font-size: 13.5px; padding-right: 56px; }
  .ktrial .row2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 18px; border-radius: 12px;
    background: var(--accent-strong); color: var(--on-accent); font-weight: 800; text-decoration: none; border: 0; cursor: pointer;
  }
  .ktrial .q { font-size: 12px; font-weight: 800; color: var(--gold-text); }
  .ktrial .bigstar { position: absolute; right: -6px; top: -4px; width: 70px; height: 70px; fill: var(--gold); opacity: .9; }

  /* ── плитки направлений ── */
  .kdirs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kdirs .cat-card {
    flex-direction: row; align-items: center; gap: 8px; min-height: 66px; padding: 9px 8px; border-radius: var(--radius);
    background: var(--surface); color: var(--tile-text); border: 1.5px solid var(--line); border-top: 3px solid var(--gold);
  }
  .kdirs .cat-card.is-zero { opacity: .5; }
  .kib { flex: none; width: 40px; height: 40px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--tile-bg); }
  .kib .kic { width: 26px; height: 26px; stroke-width: 1.7; }
  .kdirs .cat-card .name { display: block; font: 800 15px/1.15 var(--font-head); color: var(--tile-text); overflow-wrap: break-word; }
  .kdirs .cat-card .body { min-width: 0; padding: 0; }
  .kdirs .cat-card .count { display: block; font-size: 13.5px; font-weight: 800; color: var(--tile-text); margin-top: 2px; opacity: .9; }
  .kadult {
    display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: var(--radius); text-decoration: none;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--tile-text);
  }
  .kadult .grow { flex: 1; min-width: 0; }
  .kadult b { display: block; font-size: 15px; font-weight: 800; }
  .kadult small { display: block; font-size: 13px; color: var(--text-2); }

  /* ── карточки кружков (ряд «Танымал») ── */
  .kpop { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding: 0 16px; }
  .kpop::-webkit-scrollbar { display: none; }
  .kclub {
    flex: none; width: 152px; scroll-snap-align: start; display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden;
    text-decoration: none; background: var(--tile-bg); border: 1.5px solid transparent; box-shadow: var(--shadow);
  }
  .kclub .ill { border-radius: 0; aspect-ratio: 200 / 140; background: var(--tile-bg); }
  .kclub .kt { display: block; padding: 9px 11px 11px; }
  .kclub b { display: block; font-size: 15px; font-weight: 800; line-height: 1.15; color: var(--tile-text); }
  .kclub small { display: block; color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
  .kclub .pr { display: block; margin-top: 6px; font-weight: 800; color: var(--tile-text); font-size: 14.5px; }
  .kempty { color: var(--text-2); font-size: 14px; padding: 8px 0; }

  /* ── доверие и подвал ── */
  .ktrust { display: grid; gap: 8px; }
  .ktr { display: flex; gap: 12px; align-items: center; padding: 11px 13px; border-radius: 16px; background: var(--surface-2); font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .ktr .kib { width: 38px; height: 38px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--gold); color: var(--accent-strong); }
  .ktr .kib .kic { width: 22px; height: 22px; }
  .kfoot { margin-top: 20px; padding-bottom: calc(110px + env(safe-area-inset-bottom)); text-align: center; color: var(--text-2); font-size: 13px; }
  .kfoot .addr { margin-bottom: 4px; }
  .kfoot .ktools { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
  .kfoot p { margin: 6px 0 0; }

  /* ── экран направления ── */
  .kdirhead { display: flex; gap: 12px; align-items: center; margin: 4px 0 14px; padding: 14px; border-radius: 22px; background: var(--tile-bg); color: var(--tile-text); }

// ─────────── Тема ───────────
function applyTheme() {
  const root = document.documentElement;
  root.setAttribute('data-theme', priceData.meta.theme || 'nude');
  const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && bg) meta.setAttribute('content', bg);
}

// ─────────── Язык ───────────
const LANG_KEY = 'juldyzdar-lang';
const LANGS = Object.keys(priceData.ui);
let lang = loadLang();

function loadLang() {
  let saved = null;
  try { saved = window.localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }
  if (saved && LANGS.indexOf(saved) !== -1) return saved;
  return LANGS.indexOf(priceData.meta.defaultLang) !== -1 ? priceData.meta.defaultLang : LANGS[0];
}

function saveLang(value) {
  try { window.localStorage.setItem(LANG_KEY, value); } catch (e) { /* хранилище недоступно */ }
}

function t(key) { return priceData.ui[lang][key]; }

// Текст из объекта {ru, kk} на текущем языке
function loc(obj) {
  if (!obj) return '';
  return obj[lang] != null ? obj[lang] : obj[priceData.meta.defaultLang];
}

function fill(template, vars) {
  return template.replace(/\{(\w+)\}/g, function (m, key) {
    return vars[key] != null ? vars[key] : m;
  });
}

// ─────────── Форматирование ───────────
const NBSP = ' '; // неразрывный пробел (кодом — редакторы не превратят в обычный)
const CURRENCY = '₸';
const MINUS = '−'; // знак минус для «−20%»

function formatNumber(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}

function formatAmount(n) { return formatNumber(n) + NBSP + CURRENCY; }

function formatPrice(price) {
  let s = formatAmount(price.amount);
  if (price.from) s = fill(t('priceFrom'), { price: s });
  if (price.per) s += t('perPrefix') + loc(price.per);
  return s;
}

function formatDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  const parts = [];
  if (h) parts.push(h + NBSP + t('hours'));
  if (m || !h) parts.push(m + NBSP + t('minutes'));
  return t('durationApprox') + NBSP + parts.join(' ');
}

function pluralKey(n) {
  const d10 = n % 10, d100 = n % 100;
  if (d10 === 1 && d100 !== 11) return 'servicesOne';
  if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return 'servicesFew';
  return 'servicesMany';
}

function formatCount(n) { return n + NBSP + t(pluralKey(n)); }

// «от …» считается по ценам с учётом действующих акций
function minAmount(cat) {
  return Math.min.apply(null, cat.items.map(function (it) { return effectivePrice(it).amount; }));
}

function formatDate(iso) {
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : String(iso);
}

// ДД.ММ — для «Акция до 31.10»
function formatDayMonth(iso) {
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '.' + p[1] : String(iso);
}

// ─────────── Статус работы ───────────
// Время берётся в часовом поясе салона (company.timezone); если пояс не задан
// или браузер его не знает — время устройства.
const WEEKDAYS = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
let salonFormat; // undefined — ещё не создан, null — недоступен

function salonClock(date) {
  if (salonFormat === undefined) {
    salonFormat = null;
    if (company.timezone && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
      try {
        salonFormat = new Intl.DateTimeFormat('en-US', {
          timeZone: company.timezone, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        });
        if (!salonFormat.formatToParts) salonFormat = null;
      } catch (e) { salonFormat = null; }
    }
  }
  if (salonFormat) {
    try {
      const p = {};
      salonFormat.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      const day = WEEKDAYS[p.weekday];
      const h = parseInt(p.hour, 10) % 24; // некоторые браузеры пишут полночь как «24»
      const m = parseInt(p.minute, 10);
      if (day && !isNaN(h) && !isNaN(m)) return { day: day, min: h * 60 + m };
    } catch (e) { /* ниже — время устройства */ }
  }
  return { day: date.getDay() || 7, min: date.getHours() * 60 + date.getMinutes() };
}

function toMinutes(hhmm) {
  const p = String(hhmm).split(':');
  return parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10);
}

// ЧЧ:ММ из минут (для «24:00» тоже)
function formatTime(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }

const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const HHMM = /^\d{1,2}:\d{2}$/;
const SPECIAL_DAYS_AHEAD = 14; // особые даты в расписании и поиск ближайшего открытия

function timeMinutes(v) { return HHMM.test(String(v)) ? toMinutes(v) : NaN; }

// Часы одного дня в минутах: { open, close, brk: {from, to} | null } или null — выходной (или неверная запись)
function parseDay(d) {
  if (!d || d.closed) return null;
  const open = timeMinutes(d.open);
  const close = timeMinutes(d.close);
  if (isNaN(open) || isNaN(close) || close <= open || close > 1440) return null;
  const day = { open: open, close: close, brk: null };
  if (Array.isArray(d.break) && d.break.length === 2) {
    const from = timeMinutes(d.break[0]);
    const to = timeMinutes(d.break[1]);
    if (from > open && to > from && to < close) day.brk = { from: from, to: to };
  }
  return day;
}

// company.hours в общем виде: { week: [пн…вс], exceptions: { "ГГГГ-ММ-ДД": день | null } } или null.
// Новый формат — week/exceptions; старый — days/open/close (одинаковые часы в дни из days).
let salonHoursCache;

function salonHours() {
  if (salonHoursCache !== undefined) return salonHoursCache;
  salonHoursCache = null;
  const h = company.hours;
  if (!h) return null;
  const week = [];
  if (h.week) {
    DAY_KEYS.forEach(function (k) { week.push(parseDay(h.week[k])); });
  } else if (h.open && h.close) {
    const days = h.days || [1, 2, 3, 4, 5, 6, 7];
    for (let d = 1; d <= 7; d++) week.push(days.indexOf(d) !== -1 ? parseDay({ open: h.open, close: h.close }) : null);
  } else {
    return null;
  }
  const exceptions = {};
  (Array.isArray(h.exceptions) ? h.exceptions : []).forEach(function (x) {
    if (!x || !ISO_DATE.test(String(x.date))) return;
    const day = parseDay(x);
    if (day || x.closed) exceptions[x.date] = day;
  });
  salonHoursCache = { week: week, exceptions: exceptions };
  return salonHoursCache;
}

function isoToUTC(iso) {
  const p = iso.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}

function addDays(iso, n) {
  const d = isoToUTC(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

// 1 = понедельник … 7 = воскресенье
function isoWeekday(iso) { return isoToUTC(iso).getUTCDay() || 7; }

// Часы на дату: особая дата, иначе обычный день недели
function daySchedule(hours, iso) {
  return Object.prototype.hasOwnProperty.call(hours.exceptions, iso) ? hours.exceptions[iso] : hours.week[isoWeekday(iso) - 1];
}

// { state: 'open' | 'break' | 'closed', text } или null (часы не заданы или открытия в ближайшие дни нет)
function workStatus(date) {
  const hours = salonHours();
  if (!hours) return null;
  const today = salonToday(date);
  const min = salonClock(date).min;
  const d = daySchedule(hours, today);
  if (d && min >= d.open && min < d.close) {
    if (d.brk && min >= d.brk.from && min < d.brk.to) {
      return { state: 'break', text: fill(t('breakUntil'), { time: formatTime(d.brk.to) }) };
    }
    if (d.brk && min < d.brk.from && d.brk.from - min <= 60) {
      return { state: 'open', text: fill(t('breakFrom'), { time: formatTime(d.brk.from) }) };
    }
    return { state: 'open', text: fill(t('openUntil'), { time: formatTime(d.close) }) };
  }
  if (d && min < d.open) return { state: 'closed', text: fill(t('closedOpensAt'), { time: formatTime(d.open) }) };
  for (let i = 1; i <= SPECIAL_DAYS_AHEAD; i++) {
    const iso = addDays(today, i);
    const next = daySchedule(hours, iso);
    if (!next) continue;
    if (i === 1) return { state: 'closed', text: fill(t('closedOpensTomorrow'), { time: formatTime(next.open) }) };
    return { state: 'closed', text: fill(t('closedOpensDay'), { day: t('daysOn')[isoWeekday(iso) - 1], time: formatTime(next.open) }) };
  }
  return null;
}

function paintStatus(node, status) {
  node.querySelector('.status-text').textContent = status.text;
  node.className = 'status is-' + status.state;
}

// «10:00–20:00» (+ строка перерыва) или «Выходной»
function dayHours(day) {
  const box = el('span', 'dtime');
  if (!day) {
    box.appendChild(el('span', 'off', t('dayOff')));
    return box;
  }
  box.appendChild(el('span', 'num', formatTime(day.open) + '–' + formatTime(day.close)));
  if (day.brk) box.appendChild(el('span', 'brk num', fill(t('breakTime'), { from: formatTime(day.brk.from), to: formatTime(day.brk.to) })));
  return box;
}

// Содержимое панели «Режим работы»: неделя (сегодня выделено) и особые даты в ближайшие 14 дней
function fillHoursPanel(panel, date) {
  const hours = salonHours();
  const today = salonToday(date);
  const todayDay = isoWeekday(today);
  panel.textContent = '';
  panel.appendChild(el('h2', null, t('schedule')));
  const week = el('ul', 'week');
  hours.week.forEach(function (day, i) {
    const li = el('li');
    if (i + 1 === todayDay) {
      li.className = 'is-today';
      li.setAttribute('aria-current', 'date');
    }
    li.appendChild(el('span', 'dname', t('daysShort')[i]));
    li.appendChild(dayHours(day));
    week.appendChild(li);
  });
  panel.appendChild(week);
  const last = addDays(today, SPECIAL_DAYS_AHEAD);
  const dates = Object.keys(hours.exceptions).filter(function (iso) { return iso >= today && iso <= last; }).sort();
  if (!dates.length) return;
  panel.appendChild(el('h3', null, t('specialDates')));
  const list = el('ul', 'special');
  dates.forEach(function (iso) {
    const li = el('li');
    if (iso === today) li.className = 'is-today';
    li.appendChild(el('span', 'dname num', formatDayMonth(iso) + ', ' + t('daysShort')[isoWeekday(iso) - 1]));
    li.appendChild(dayHours(hours.exceptions[iso]));
    list.appendChild(li);
  });
  panel.appendChild(list);
}

// Раскрыто ли расписание — только в памяти страницы (сохраняется при смене языка и «Назад»)
let hoursOpen = false;

// Статус-кнопка и панель расписания (null, если статуса нет)
function hoursBlock() {
  const now = new Date();
  const status = workStatus(now);
  if (!status) return null;
  const box = el('div', 'hours');
  const btn = el('button');
  btn.type = 'button';
  btn.setAttribute('aria-controls', 'hours-panel');
  btn.setAttribute('aria-expanded', hoursOpen ? 'true' : 'false');
  btn.appendChild(el('span', 'status-text'));
  btn.appendChild(svgNode(ICONS.down));
  paintStatus(btn, status);
  const panel = el('div', 'hours-panel');
  panel.id = 'hours-panel';
  panel.hidden = !hoursOpen;
  fillHoursPanel(panel, now);
  btn.addEventListener('click', function () {
    hoursOpen = !hoursOpen;
    btn.setAttribute('aria-expanded', hoursOpen ? 'true' : 'false');
    panel.hidden = !hoursOpen;
  });
  box.appendChild(btn);
  box.appendChild(panel);
  return box;
}

function refreshStatus() {
  const box = document.querySelector('.hours');
  if (!box) return;
  const now = new Date();
  const status = workStatus(now);
  if (status) paintStatus(box.querySelector('.status'), status);
  fillHoursPanel(box.querySelector('.hours-panel'), now);
}

// Обновление раз в минуту, в начале каждой минуты
function scheduleStatus() {
  refreshStatus();
  refreshPromos();
  setTimeout(scheduleStatus, 60000 - Date.now() % 60000 + 50);
}

// ─────────── Акции ───────────
// Акция действует, пока сегодняшняя дата салона (company.timezone) не позже promo.until.
// Неверно заполненная акция (цена не меньше обычной, дата не ГГГГ-ММ-ДД) просто не показывается.
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
let dateFormat; // undefined — ещё не создан, null — недоступен
let promoDay = ''; // дата (ГГГГ-ММ-ДД), по которой нарисован экран

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function salonToday(date) {
  if (dateFormat === undefined) {
    dateFormat = null;
    if (company.timezone && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
      try {
        dateFormat = new Intl.DateTimeFormat('en-US', {
          timeZone: company.timezone, year: 'numeric', month: '2-digit', day: '2-digit'
        });
        if (!dateFormat.formatToParts) dateFormat = null;
      } catch (e) { dateFormat = null; }
    }
  }
  if (dateFormat) {
    try {
      const p = {};
      dateFormat.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      const iso = p.year + '-' + p.month + '-' + p.day;
      if (ISO_DATE.test(iso)) return iso;
    } catch (e) { /* ниже — дата устройства */ }
  }
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

// Варианты цены услуги (непустой массив, у каждого числовая amount) или null
function itemVariants(item) {
  const v = item.variants;
  if (!Array.isArray(v) || !v.length) return null;
  for (let i = 0; i < v.length; i++) {
    if (!v[i] || typeof v[i].amount !== 'number' || !(v[i].amount >= 0)) return null;
  }
  return v;
}

function minVariantAmount(variants) {
  return Math.min.apply(null, variants.map(function (v) { return v.amount; }));
}

// Действующая акция услуги или null (с вариантами цены акция не действует)
function activePromo(item) {
  if (itemVariants(item)) return null;
  const p = item.promo;
  if (!p || typeof p.amount !== 'number' || !(p.amount >= 0) || !(p.amount < item.price.amount)) return null;
  if (!ISO_DATE.test(String(p.until)) || promoDay > p.until) return null;
  return p;
}

// Цена с учётом акции: from и per — от обычной цены.
// С вариантами — «от <минимальный вариант>».
function effectivePrice(item) {
  const variants = itemVariants(item);
  if (variants) return { amount: minVariantAmount(variants), from: true, per: item.price.per };
  const p = activePromo(item);
  return p ? { amount: p.amount, from: item.price.from, per: item.price.per } : item.price;
}

function discountPercent(item, p) {
  return Math.round((item.price.amount - p.amount) / item.price.amount * 100);
}

function formatSaving(item, p) {
  let s = formatAmount(item.price.amount - p.amount);
  if (item.price.per) s += t('perPrefix') + loc(item.price.per);
  return s;
}

// Все действующие акции по порядку прайса
function activePromos() {
  const list = [];
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      const p = activePromo(item);
      if (p) list.push({ cat: cat, item: item, promo: p });
    });
  });
  return list;
}

function promoKey() {
  return activePromos().map(function (r) { return r.item.id; }).join(',');
}

// Наступил новый день и какая-то акция закончилась — перерисовать экран на месте
function refreshPromos() {
  const day = salonToday(new Date());
  if (day === promoDay) return;
  const before = promoKey();
  promoDay = day;
  if (currentRoute && promoKey() !== before) redraw();
}

// ─────────── Поиск ───────────
let searchQuery = '';

function normalize(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
}

// Сначала совпадения в названии услуги, потом в названии категории, потом в описании
function searchItems(query) {
  const q = normalize(query);
  if (!q) return [];
  const groups = [[], [], []];
  priceData.categories.forEach(function (cat) {
    const inCat = normalize(loc(cat.name)).indexOf(q) !== -1;
    cat.items.forEach(function (item) {
      let g = -1;
      if (normalize(loc(item.name)).indexOf(q) !== -1) g = 0;
      else if (inCat) g = 1;
      else if (item.desc && normalize(loc(item.desc)).indexOf(q) !== -1) g = 2;
      if (g !== -1) groups[g].push({ cat: cat, item: item });
    });
  });
  return groups[0].concat(groups[1], groups[2]);
}

// ─────────── Построение DOM ───────────
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function externalLink(className, href) {
  const a = el('a', className);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

// SVG берётся только из кода (ILLUSTRATIONS / ICONS), не из данных
function svgNode(markup) {
  const box = document.createElement('div');
  box.innerHTML = markup;
  return box.firstChild;
}

function illustration(key, className) {
  const box = el('div', 'ill ' + className);
  box.innerHTML = Object.prototype.hasOwnProperty.call(ILLUSTRATIONS, key) ? ILLUSTRATIONS[key] : ILL_PLACEHOLDER;
  return box;
}

function circleIcon(name, extra) {
  const span = el('span', 'circle' + (extra ? ' ' + extra : ''));
  span.innerHTML = ICONS[name];
  return span;
}

// Элемент появляется по очереди с соседями
function stagger(node, i) {
  node.classList.add('stagger');
  node.style.setProperty('--i', i);
  return node;
}

function hitBadge() { return el('span', 'hit', t('hit')); }

function durationLabel(minutes) {
  const span = el('span', 'dur');
  span.appendChild(svgNode(ICONS.clock));
  span.appendChild(el('span', 'num', formatDuration(minutes)));
  return span;
}

function backLink(href, parentKey, text) {
  const a = el('a', 'back');
  a.href = href;
  a.appendChild(svgNode(ICONS.back));
  a.appendChild(el('span', null, text));
  a.addEventListener('click', function (e) {
    // Если предыдущий экран в истории — этот же родитель, просто шаг назад
    if (routeKeys[currentIdx - 1] === parentKey) {
      e.preventDefault();
      history.back();
    }
  });
  return a;
}

function ornament() {
  const o = el('div', 'ornament');
  o.setAttribute('aria-hidden', 'true');
  o.appendChild(el('span'));
  return o;
}

function discountBadge(item, p) {
  return el('span', 'promo-badge num', MINUS + discountPercent(item, p) + '%');
}

// Зачёркнутая старая цена (только сумма: «от» и « / ноготь» есть у новой цены рядом)
function oldPrice(item) {
  const text = formatAmount(item.price.amount);
  const del = el('del', 'old num', text);
  del.setAttribute('aria-label', t('oldPrice') + ' ' + text);
  return del;
}

// Новая цена и под ней старая
function promoPrice(item, className) {
  const box = el('div', className);
  box.appendChild(el('span', 'new', formatPrice(effectivePrice(item))));
  box.appendChild(oldPrice(item));
  return box;
}

// Строка услуги: в списке категории — длительность и «Хит», в поиске — название категории
function serviceRow(cat, item, withCategory) {
  const promo = activePromo(item);
  const row = el('a', 'row');
  row.href = itemHash(cat, item);
  row.appendChild(illustration(item.illustration, 'ill-mini'));
  const info = el('div', 'info');
  info.appendChild(el('div', 'name', loc(item.name)));
  if (withCategory) {
    info.appendChild(el('div', 'cat', loc(cat.name)));
    if (promo) {
      const meta = el('div', 'meta');
      meta.appendChild(discountBadge(item, promo));
      info.appendChild(meta);
    }
  } else if (item.duration || item.hit || promo) {
    const meta = el('div', 'meta');
    if (item.duration) meta.appendChild(durationLabel(item.duration));
    if (item.hit) meta.appendChild(hitBadge());
    if (promo) meta.appendChild(discountBadge(item, promo));
    info.appendChild(meta);
  }
  row.appendChild(info);
  if (promo) row.appendChild(promoPrice(item, 'price num is-promo'));
  else row.appendChild(el('div', 'price num', formatPrice(effectivePrice(item))));
  row.appendChild(svgNode(ICONS.chev));
  return row;
}

// ─────────── Варианты цены ───────────
// Выбранный вариант (номер в массиве) по ключу «категория/услуга» — только в памяти страницы:
// сохраняется при смене языка и «Назад», после перезагрузки ничего не выбрано
const chosenVariants = {};

// Цена варианта: «6 000 ₸» (+ « / ноготь», если у услуги есть per)
function variantPrice(item, v) {
  let s = formatAmount(v.amount);
  if (item.price.per) s += t('perPrefix') + loc(item.price.per);
  return s;
}

// Ссылка записи: вариант выбран → шаблон с вариантом; акция → шаблон акции; иначе обычный
function bookLink(item, promo, variant) {
  if (variant) {
    return waLink(fill(t('waTemplateVariant'), {
      name: loc(item.name),
      variant: loc(variant.name),
      price: variantPrice(item, variant)
    }));
  }
  return waLink(fill(t(promo ? 'waTemplatePromo' : 'waTemplate'), {
    name: loc(item.name),
    price: formatPrice(effectivePrice(item))
  }));
}

// Ссылка онлайн-записи: своя у категории приоритетнее общей; только http/https, иначе ссылки нет
function httpUrl(u) { return typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim()) ? u.trim() : ''; }

function bookingUrl(cat) {
  return httpUrl(cat.bookingUrl) || httpUrl(company.booking && company.booking.url);
}

function bookingLabel() {
  const label = company.booking && company.booking.label;
  return (label && loc(label)) || t('bookOnline');
}

// Таблица вариантов с выбором (радиокнопки, по умолчанию ничего не выбрано)
function variantsBlock(cat, item, variants, chosen, onChoose) {
  const box = el('fieldset', 'variants');
  box.appendChild(el('legend', null, t('variantsTitle')));
  const hint = el('p', 'hint', t('chooseVariant'));
  hint.id = 'vh-' + cat.id + '-' + item.id;
  box.setAttribute('aria-describedby', hint.id);
  box.appendChild(hint);
  const opts = el('div', 'opts');
  const labels = [];
  variants.forEach(function (v) {
    const label = el('label', 'opt');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'variant-' + cat.id + '-' + item.id;
    input.checked = v === chosen;
    if (input.checked) label.classList.add('is-checked');
    input.addEventListener('change', function () {
      if (!input.checked) return;
      labels.forEach(function (l) { l.classList.toggle('is-checked', l === label); });
      onChoose(v);
    });
    label.appendChild(input);
    label.appendChild(el('span', 'vname', loc(v.name)));
    label.appendChild(el('span', 'vprice num', variantPrice(item, v)));
    labels.push(label);
    opts.appendChild(label);
  });
  box.appendChild(opts);
  return box;
}

// Лента акций на главной (null, если действующих акций нет)
function promoStrip() {
  const promos = activePromos();
  if (!promos.length) return null;
  const section = el('section', 'promos');
  section.appendChild(el('h2', 'section-title', t('promosTitle')));
  const strip = el('div', 'promo-strip');
  promos.forEach(function (r, i) {
    const card = stagger(el('a', 'promo-card'), i);
    card.href = itemHash(r.cat, r.item);
    card.appendChild(illustration(r.item.illustration, 'ill-tile'));
    card.appendChild(discountBadge(r.item, r.promo));
    const body = el('div', 'body');
    body.appendChild(el('div', 'name', loc(r.item.name)));
    body.appendChild(promoPrice(r.item, 'price num'));
    card.appendChild(body);
    strip.appendChild(card);
  });
  section.appendChild(strip);
  return section;
}

// Перерисовывает только результаты, поле ввода не трогает (фокус и клавиатура остаются)
function showSearch(parts) {
  const active = normalize(searchQuery) !== '';
  parts.clear.hidden = searchQuery === '';
  parts.browse.hidden = active;
  parts.results.textContent = '';
  parts.empty.textContent = '';
  if (!active) return;
  const found = searchItems(searchQuery);
  if (!found.length) {
    parts.empty.textContent = t('nothingFound');
    return;
  }
  const list = el('ul', 'list');
  found.forEach(function (r) {
    const li = el('li');
    li.appendChild(serviceRow(r.cat, r.item, true));
    list.appendChild(li);
  });
  parts.results.appendChild(list);
}

function renderHome(screen) {
  const top = el('div', 'topbar');

  switcher.setAttribute('role', 'group');
  LANGS.forEach(function (code) {

    b.setAttribute('aria-pressed', code === lang ? 'true' : 'false');
    b.addEventListener('click', function () { setLang(code); });
    switcher.appendChild(b);
  });
  const tools = el('div', 'tools');
  tools.appendChild(iconButton('share', 'share-home', t('share'), function () { shareLink(null, null); }));
  tools.appendChild(iconButton('qr', 'qr-btn', t('showQr'), function () { openQr(this); }));
  top.appendChild(tools);
  top.appendChild(switcher);
  screen.appendChild(top);

  const hero = el('header', 'hero');
  const heroTop = el('div', 'hero-top');
  const sprigL = svgNode(SPRIG);
  sprigL.classList.add('sprig-l');
  const sprigR = svgNode(SPRIG);
  sprigR.classList.add('sprig-r');
  const mono = el('div', 'mono');

  heroTop.appendChild(sprigL);

  heroTop.appendChild(sprigR);
  hero.appendChild(heroTop);
  hero.appendChild(el('h1', 'salon', company.name));
  hero.appendChild(el('p', 'sub', loc(company.subtitle)));
  hero.appendChild(ornament());
  const addr = el('p', 'addr');
  addr.appendChild(svgNode(ICONS.pin));
  addr.appendChild(el('span', null, loc(company.address)));
  hero.appendChild(addr);
  const hoursBox = hoursBlock();
  if (hoursBox) hero.appendChild(hoursBox);
  screen.appendChild(hero);

  const actions = el('nav', 'actions');
  const wa = externalLink('action', waLink(t('waGreeting')));
  wa.appendChild(circleIcon('whatsapp', 'wa'));
  wa.appendChild(el('span', null, t('actionWhatsapp')));
  const call = el('a', 'action');
  call.href = telLink();
  call.appendChild(circleIcon('call'));
  call.appendChild(el('span', null, t('actionCall')));
  const route = externalLink('action', company.mapLink);
  route.appendChild(circleIcon('route'));
  route.appendChild(el('span', null, t('actionRoute')));
  actions.appendChild(wa);
  actions.appendChild(call);
  actions.appendChild(route);
  screen.appendChild(actions);

  // Поиск: пока в поле есть текст, вместо категорий показываются результаты
  const search = el('div', 'search');
  search.setAttribute('role', 'search');
  search.appendChild(svgNode(ICONS.search));
  const input = el('input');
  input.type = 'search';
  input.placeholder = t('searchPlaceholder');
  input.setAttribute('aria-label', t('searchPlaceholder'));
  input.setAttribute('enterkeyhint', 'search');
  input.setAttribute('autocomplete', 'off');
  input.spellcheck = false;
  input.value = searchQuery;
  const clear = el('button', 'search-clear');
  clear.type = 'button';
  clear.setAttribute('aria-label', t('searchClear'));
  clear.appendChild(svgNode(ICONS.close));
  search.appendChild(input);
  search.appendChild(clear);
  screen.appendChild(search);

  const results = el('div', 'results');
  const empty = el('p', 'empty');
  empty.setAttribute('aria-live', 'polite');
  const browse = el('div', 'browse');
  screen.appendChild(results);
  screen.appendChild(empty);
  screen.appendChild(browse);
  const parts = { clear: clear, results: results, empty: empty, browse: browse };

  input.addEventListener('input', function () {
    searchQuery = input.value;
    showSearch(parts);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') input.blur(); // спрятать клавиатуру
  });
  clear.addEventListener('click', function () {
    input.value = '';
    searchQuery = '';
    showSearch(parts);
    input.focus();

  const promos = promoStrip();

function renderCategory(screen, cat) {
  screen.appendChild(backLink('#/', 'home', t('categories')));

  head.appendChild(illustration(cat.illustration, 'ill-big'));
  head.appendChild(el('h1', null, loc(cat.name)));
  head.appendChild(el('p', 'from num', fill(t('priceFrom'), { price: formatAmount(minAmount(cat)) })));
  screen.appendChild(head);

  // Подряд идущие услуги с одинаковым group — свой список под заголовком раздела;
  // без group — список без заголовка (категория без разделов — один список, как раньше)
  let list = null;
  let group = null;
  cat.items.forEach(function (item, i) {
    const g = item.group ? loc(item.group) : '';
    if (!list || g !== group) {

function renderItem(screen, cat, item, app) {
  screen.classList.add('screen-item');
  screen.appendChild(backLink(catHash(cat), 'c/' + cat.id, loc(cat.name)));
  screen.appendChild(iconButton('share', 'share-item', t('share'), function () { shareLink(cat, item); }));

  const card = el('article', 'card');
  card.appendChild(illustration(item.illustration, 'ill-hero draw'));
  const body = el('div', 'card-body');
  body.appendChild(el('h1', null, loc(item.name)));
  const promo = activePromo(item);
  if (promo) {
    const prices = el('div', 'price-promo');
    prices.appendChild(el('p', 'price-big num', formatPrice(effectivePrice(item))));
    prices.appendChild(oldPrice(item));
    body.appendChild(prices);
    const info = el('p', 'promo-info');
    info.appendChild(el('span', 'promo-tag num', t('promo') + ' ' + fill(t('promoUntil'), { date: formatDayMonth(promo.until) })));
    info.appendChild(el('span', 'save num', fill(t('promoSave'), { sum: formatSaving(item, promo) })));
    body.appendChild(info);
  }
  const variants = itemVariants(item);
  const key = cat.id + '/' + item.id;
  const chosen = variants ? variants[chosenVariants[key]] || null : null;
  let priceBig = null;
  if (!promo) {
    priceBig = el('p', 'price-big num', chosen ? variantPrice(item, chosen) : formatPrice(effectivePrice(item)));
    body.appendChild(priceBig);
  }
  if (item.duration || item.hit) {
    const meta = el('p', 'meta');
    if (item.duration) meta.appendChild(durationLabel(item.duration));
    if (item.hit) meta.appendChild(hitBadge());
    body.appendChild(meta);
  }
  if (variants) {
    body.appendChild(variantsBlock(cat, item, variants, chosen, function (v) {
      chosenVariants[key] = variants.indexOf(v);
      // Без перерисовки экрана: только крупная цена и ссылка записи

      book.href = bookLink(item, null, v);

    book.appendChild(svgNode(ICONS.whatsapp));
    book.appendChild(el('span', null, t('writeWhatsapp')));
  } else {
    book = externalLink('btn-book', bookLink(item, promo, chosen));
    book.appendChild(svgNode(ICONS.whatsapp));
    book.appendChild(el('span', null, t('book')));
  }
  bar.appendChild(book);
