  document.title = loc(item.name) + ' · ' + company.name;
}

// ─────────── «Поделиться» ───────────
// Кнопка-иконка: подпись для диктора и подсказка — из ui
function iconButton(icon, className, label, onClick) {
  const b = el('button', 'icon-btn ' + className);
  b.type = 'button';
  b.setAttribute('aria-label', label);
  b.title = label;
  b.appendChild(svgNode(ICONS[icon]));
  b.addEventListener('click', onClick);
  return b;
}

// Ссылка всегда на сайт (и при открытии файлом), с меткой источника; из карточки — прямо на услугу
function shareUrl(cat, item) {
  return priceData.meta.siteUrl + '?src=share' + (item ? itemHash(cat, item) : '');
}

// Системное меню → копирование в буфер (+ уведомление) → WhatsApp
function shareLink(cat, item) {
  const url = shareUrl(cat, item);
  const text = fill(t('shareText'), { name: company.name });
  if (navigator.share) {
    navigator.share({ title: document.title, text: text, url: url }).catch(function (e) {
      if (e && e.name === 'AbortError') return; // человек закрыл меню
      copyLink(url, text);
    });
    return;
  }
  copyLink(url, text);
}

function copyLink(url, text) {
  function legacy() {
    if (legacyCopy(url)) showToast(t('linkCopied'));
    else window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank', 'noopener');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(t('linkCopied')); }, legacy);
      return;
    }
  } catch (e) { /* ниже — запасной способ */ }
  legacy();
}

// Старый способ копирования (браузеры без navigator.clipboard)
function legacyCopy(value) {
  const area = el('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(area);
  let ok = false;
  try {
    area.select();
    area.setSelectionRange(0, value.length);
    ok = document.execCommand('copy');
  } catch (e) { ok = false; }
  document.body.removeChild(area);
  return ok;
}

let toastTimer = null;
function showToast(text) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = el('div', 'toast');
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
    toast.offsetWidth; // чтобы появление было плавным
  }
  toast.textContent = text;
  toast.classList.toggle('is-above-bar', !!document.querySelector('.book-bar'));
  toast.classList.toggle('has-booking', !!document.querySelector('.book-bar.has-booking'));
  toast.classList.add('is-shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('is-shown'); }, 2000);
}

// ─────────── Окно «QR-код» ───────────
// Открытие добавляет запись в историю (адрес тот же) — системная «Назад» закрывает окно.
let qrModal = null;
let qrOpener = null;

function openQr(opener) {
  if (qrModal) return;
  qrOpener = opener;
  const modal = el('div', 'qr-modal');
  const dialog = el('div', 'qr-dialog');
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-labelledby', 'qr-title');
  dialog.setAttribute('aria-describedby', 'qr-hint');
  const close = iconButton('close', 'qr-close', t('close'), function () { closeQr(); });
  const box = el('div', 'qr-box');
  box.appendChild(svgNode(QR_SVG));
  const name = el('p', 'qr-name', company.name);
  name.id = 'qr-title';
  const hint = el('p', 'qr-hint', t('qrHint'));
  hint.id = 'qr-hint';
  dialog.appendChild(close);
  dialog.appendChild(box);
  dialog.appendChild(name);
  dialog.appendChild(hint);
  modal.appendChild(dialog);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeQr(); // нажатие на фон
  });
  modal.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      closeQr();
    } else if (e.key === 'Tab') {
      // Фокус не выходит из окна
      const items = dialog.querySelectorAll('button, [href]');
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    }
  });
  document.body.appendChild(modal);
  qrModal = modal;
  document.getElementById('app').setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = 'hidden';
  try { history.pushState({ idx: currentIdx, qr: true }, ''); } catch (e) { /* без записи «Назад» не закроет окно */ }
  close.focus();
}

// fromHistory — окно закрыла системная «Назад» (запись истории уже снята)
function closeQr(fromHistory) {
  if (!qrModal) return;
  if (!fromHistory && history.state && history.state.qr) {
    history.back(); // окно закроется в обработчике popstate
    return;
  }
  qrModal.parentNode.removeChild(qrModal);
  qrModal = null;
  document.getElementById('app').removeAttribute('aria-hidden');
  document.documentElement.style.overflow = '';
  // Экран могли перерисовать (смена дня) — тогда фокус на новую кнопку
  const target = qrOpener && document.contains(qrOpener) ? qrOpener : document.querySelector('.qr-btn');
  qrOpener = null;
  if (target) target.focus({ preventScroll: true });
}

function onPopState() {
  if (qrModal && !(history.state && history.state.qr)) closeQr(true);
}

// Фокус ушёл за пределы открытого окна (например, кликом) — вернуть в окно
function keepFocusInQr(e) {
  if (qrModal && !qrModal.contains(e.target)) {
    const close = qrModal.querySelector('.qr-close');
    if (close) close.focus();
  }
}

// ─────────── Маршрутизация ───────────
// #/ — главная, #/c/<catId> — категория, #/s/<catId>/<itemId> — услуга
function findById(list, id) {
  for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

function parseRoute(hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(safeDecode);
  if (parts.length === 0) return { screen: 'home', key: 'home' };
  if (parts[0] === 'c' && parts.length === 2) {
    const cat = findById(priceData.categories, parts[1]);
    if (cat) return { screen: 'cat', key: 'c/' + cat.id, cat: cat };
  }
  if (parts[0] === 's' && parts.length === 3) {
    const cat = findById(priceData.categories, parts[1]);
    const item = cat ? findById(cat.items, parts[2]) : null;
    if (item) return { screen: 'item', key: 's/' + cat.id + '/' + item.id, cat: cat, item: item };
  }
  return null;
}

// Номер записи истории хранится в history.state.idx:
// меньше текущего — это «назад» (восстановить прокрутку), иначе — «вперёд» (наверх).
let currentIdx = 0;
let currentRoute = null;
const scrollPositions = {};
const routeKeys = {};

// direction: 'fwd' | 'back' | null (без анимации экрана, например смена языка)
function render(route, direction) {
  const app = document.getElementById('app');
  app.textContent = '';
  const screen = el('div', 'screen');
  app.appendChild(screen);
  if (route.screen === 'cat') renderCategory(screen, route.cat);
  else if (route.screen === 'item') renderItem(screen, route.cat, route.item, app);
  else renderHome(screen);

  if (direction) {
    screen.classList.add(direction === 'back' ? 'enter-back' : 'enter-fwd');
    // После въезда снимаем класс, чтобы на экране не оставалось transform
    screen.addEventListener('animationend', function done(e) {
      if (e.target !== screen) return;
      screen.classList.remove('enter-fwd', 'enter-back');
      screen.removeEventListener('animationend', done);
    });
  } else {
    // Без анимации экрана — и без поочерёдного появления элементов
    const items = screen.querySelectorAll('.stagger');
    for (let i = 0; i < items.length; i++) items[i].classList.remove('stagger');
    const drawn = screen.querySelector('.draw');
    if (drawn) drawn.classList.remove('draw');
    const bar = app.querySelector('.book-bar');
    if (bar) bar.style.animation = 'none';
  }
}

function onRoute() {
  let route = parseRoute(location.hash);
  const unknown = !route;
  if (unknown) route = { screen: 'home', key: 'home' };

  const state = history.state;
  let idx;
  let isBack = false;
  if (state && typeof state.idx === 'number') {
    idx = state.idx;
    isBack = idx < currentIdx;
  } else {
    idx = currentIdx + 1;
  }
  // Неизвестный адрес → главная, без лишней записи в истории
  if (unknown) history.replaceState({ idx: idx }, '', '#/');
  else history.replaceState({ idx: idx }, '');

  currentIdx = idx;
  currentRoute = route;
  routeKeys[idx] = route.key;
  render(route, isBack ? 'back' : 'fwd');
  window.scrollTo(0, isBack ? (scrollPositions[idx] || 0) : 0);
}

// Перерисовать текущий экран на месте: без анимации, прокрутка сохраняется
function redraw() {
  const y = window.pageYOffset;
  const inSearch = document.activeElement && document.activeElement.type === 'search';
  render(currentRoute, null);
  window.scrollTo(0, y);
  if (inSearch) {
    const input = document.querySelector('.search input');
    if (input) input.focus({ preventScroll: true });
  }
}

function setLang(code) {
  if (code === lang) return;
  lang = code;
  saveLang(code);
  document.documentElement.lang = code;
  const hadFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.lang');
  redraw();
  if (hadFocus) {
    const btn = document.querySelector('.lang button[lang="' + code + '"]');
    if (btn) btn.focus({ preventScroll: true });
  }
}

// ─────────── PWA: только на сайте (http/https) ───────────
// Manifest и значок подключаются отсюда, а не в <head>: при открытии файлом (file://)
// браузер не может их прочитать и пишет ошибку в консоль.
function setupPwa() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    const links = [['manifest', 'manifest.webmanifest'], ['icon', 'icons/icon-192.png']];
    links.forEach(function (l) {
      const link = document.createElement('link');
      link.rel = l[0];
      link.href = l[1];
      document.head.appendChild(link);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  } catch (e) { /* без PWA прайс работает как обычная страница */ }
}

// promo и variants в одной услуге не поддерживаются: действует только variants
// (сообщение для того, кто правит данные; на экране ошибки нет)
function warnPromoWithVariants() {
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      if (item.promo && itemVariants(item) && window.console) {
        console.warn('priceData: услуга "' + item.id + '" — указаны и promo, и variants; promo не действует.');
      }
    });
  });
}

function init() {
  applyTheme();
  setupPwa();
  document.documentElement.lang = lang;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.addEventListener('scroll', function () {
    scrollPositions[currentIdx] = window.pageYOffset;
  }, { passive: true });
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('popstate', onPopState);
  document.addEventListener('focusin', keepFocusInQr);
  // Страницу перезагрузили с открытым окном QR — убрать лишнюю запись истории
  if (history.state && history.state.qr) history.back();
  promoDay = salonToday(new Date());
  warnPromoWithVariants();
  onRoute();
  scheduleStatus();
  // Телефон мог «спать» — при возврате на вкладку сразу обновить статус и акции
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      refreshStatus();
      refreshPromos();
    }
  });
}

// Как у кафе, подменяет функции движка своими версиями: главная (renderHome — макет B: шапка, чипы возраста, пробное занятие,
// направления, «Танымал», доверие), экран направления (renderCategory), карточка кружка (renderItem), экраны #/program
// и #/adult (parseRoute + renderHome), нижняя панель программы (render). Общее с салонами: язык, режим работы и статус,

// Звезда (мотив логотипа): путь для иконок и шапки
function starPath(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}

function kicon(name, cls) {

// Хранилище — только в try/catch: недоступно — выбор живёт в памяти страницы
function kGet(key) {
  try {
    const s = window.localStorage.getItem(key);
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}
function kSet(key, value) {

}

// ─────────── Слова и числа ───────────
// Склонение по-русски: [один, несколько, много]; у казахского все три формы одинаковые
function kPlural(forms, n) {
  const d10 = n % 10, d100 = n % 100;
  if (!Array.isArray(forms)) return forms;
  if (d10 === 1 && d100 !== 11) return forms[0];
  if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return forms[1];
  return forms[2];
}
function clubsCount(n) { return n + NBSP + t(n % 10 === 1 && n % 100 !== 11 ? 'clubsOne' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'clubsFew' : 'clubsMany'); }
function yearsText(n) { return n + NBSP + kPlural(t('years'), n); }
function ageText(item) { return item.adult ? t('adult') : item.age[0] + '–' + item.age[1] + NBSP + kPlural(t('years'), item.age[1]); }
function timesText(n) { return fill(kPlural(t('timesWeek'), n), { n: n }); }
function oneDur(m) {
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return m + NBSP + kPlural(t('durMin'), m);
  return h + NBSP + kPlural(t('durHour'), h) + (r ? ' ' + r + NBSP + kPlural(t('durMin'), r) : '');
}
// 60 → «1 сағат», 75 → «1 сағат 15 минут», [60, 90] → «1–1,5 сағат»
function durText(d) {
  if (!Array.isArray(d)) return oneDur(d);
  const h = function (m) { return String(m / 60).replace('.', ','); };
  if (d[0] % 30 === 0 && d[1] % 30 === 0 && d[0] >= 60) return h(d[0]) + '–' + h(d[1]) + NBSP + kPlural(t('durHour'), d[1] % 60 ? 2 : d[1] / 60);
  return d[0] + '–' + d[1] + NBSP + kPlural(t('durMin'), d[1]);
}
function priceText(item) { return formatAmount(item.price.amount) + t(item.price.unit === 'lesson' ? 'lessonShort' : 'monthShort'); }
// ≈ цена одного занятия: в месяц / (раз в неделю × 4), до 10 ₸; у цены «за занятие» и индивидуальных — нет
function approxLesson(item) {
  if (item.price.unit !== 'month' || !(item.perWeek > 0)) return 0;
  return Math.round(item.price.amount / (item.perWeek * 4) / 10) * 10;
}
function freqText(item) { return item.perWeek > 0 ? timesText(item.perWeek) : t('individual'); }

// Кружок подходит чипу, если его возраст пересекается с чипом хотя бы на год; adult — только «Ересектер»

  if (a.adult) return !!item.adult;

  return item.age[0] <= a.to && item.age[1] >= a.from;

const SHOW_SUN = priceData.categories.some(function (c) {
  return c.items.some(function (it) {
    return (it.schedule && it.schedule.sun) || (it.groups || []).some(function (g) { return g.schedule && g.schedule.sun; });
  });
});
const DAYS_SHOWN = SHOW_SUN ? 7 : 6;

function findGroup(item, gid) {
  const gs = item.groups || [];
  for (let i = 0; i < gs.length; i++) if (gs[i].id === gid) return gs[i];
  return gs[0] || null;
}
function scheduleOf(item, gid) {
  const g = findGroup(item, gid);
  return (g ? g.schedule : item.schedule) || {};
}
// Группа по возрасту ребёнка (или чипу): первая, чей возраст подходит
function groupFor(item, years, chipId) {
  const gs = item.groups || [];
  const a = chipById(chipId);
  for (let i = 0; i < gs.length; i++) {
    const g = gs[i];
    if (!g.age) continue;
    if (years && g.age[0] <= years && g.age[1] >= years) return g.id;
    if (!years && a && !a.adult && g.age[0] <= a.to && g.age[1] >= a.from) return g.id;
  }
  return gs.length ? gs[0].id : '';
}
function slotStart(s) { return String(s).split('–')[0]; }

// Время по умолчанию: первое время первого дня; дни, где есть это же время, — до perWeek; не хватает — первое время других дней
function defaultSlots(item, gid) {
  const sch = scheduleOf(item, gid);
  const days = KDAYS.filter(function (d) { return sch[d] && sch[d].length; });
  const out = {};
  if (!days.length) return out;
  const want = item.perWeek > 0 ? item.perWeek : 1;
  const first = slotStart(sch[days[0]][0]);
  let n = 0;
  days.forEach(function (d) {
    if (n >= want) return;
    for (let i = 0; i < sch[d].length; i++) if (slotStart(sch[d][i]) === first) { out[d] = sch[d][i]; n++; return; }
  });
  days.forEach(function (d) {
    if (n >= want || out[d]) return;
    out[d] = sch[d][0];
    n++;
  });
  return out;
}

// ─────────── Программа ребёнка ───────────
// { cur: номер ребёнка, kids: [{ name, age, trial, items: [{ c: направление, i: кружок, g: группа, slots: { mon: "09:00–10:00" } }] }] }
// Цены не хранятся — всегда из текущих данных; кружки, которых больше нет, пропадают.
function findClub(c, i) {
  const cat = findById(priceData.categories, c);
  const item = cat ? findById(cat.items, i) : null;
  return item ? { cat: cat, item: item } : null;
}
function newKid() { return { name: '', age: 0, trial: !!TRIAL, items: [] }; }

function loadProgram() {
  const raw = kGet(PROGRAM_KEY);
  const out = { cur: 0, kids: [] };
  if (raw && Array.isArray(raw.kids)) {
    raw.kids.slice(0, KIDS_MAX).forEach(function (k) {
      if (!k || typeof k !== 'object') return;
      const kid = newKid();
      kid.name = typeof k.name === 'string' ? k.name.slice(0, 40) : '';
      kid.age = Number.isInteger(k.age) && k.age >= 1 && k.age <= 18 ? k.age : 0;
      if (typeof k.trial === 'boolean') kid.trial = k.trial && !!TRIAL;
      (Array.isArray(k.items) ? k.items : []).forEach(function (e) {
        if (!e || typeof e.c !== 'string' || typeof e.i !== 'string') return;
        const r = findClub(e.c, e.i);
        if (!r || kid.items.some(function (x) { return x.c === e.c && x.i === e.i; })) return;
        const g = findGroup(r.item, e.g);
        const sch = scheduleOf(r.item, g ? g.id : '');
        const slots = {};
        if (e.slots && typeof e.slots === 'object') {
          KDAYS.forEach(function (d) { if (sch[d] && sch[d].indexOf(e.slots[d]) !== -1) slots[d] = e.slots[d]; });
        }
        kid.items.push({ c: e.c, i: e.i, g: g ? g.id : '', slots: slots });
      });
      out.kids.push(kid);
    });
    if (Number.isInteger(raw.cur) && raw.cur >= 0 && raw.cur < out.kids.length) out.cur = raw.cur;
  }
  if (!out.kids.length) out.kids.push(newKid());
  return out;
}
let program = loadProgram();

function saveProgram() { kSet(PROGRAM_KEY, program); }
function curKid() { return program.kids[program.cur]; }
function inProgram(cat, item) { return curKid().items.some(function (e) { return e.c === cat.id && e.i === item.id; }); }

function addToProgram(cat, item, gid) {
  const kid = curKid();
  if (inProgram(cat, item)) return;
  const g = gid || groupFor(item, kid.age, kAge);
  kid.items.push({ c: cat.id, i: item.id, g: g, slots: defaultSlots(item, g) });
  saveProgram();
}

// Строки программы с кружками: [{ e, cat, item }]
function programLines(kid) {
  const out = [];
  (kid || curKid()).items.forEach(function (e) {
    const r = findClub(e.c, e.i);
    if (r) out.push({ e: e, cat: r.cat, item: r.item });
  });
  return out;
}

// Итог в месяц: кружки «в месяц»; скидка на второй кружок — на все, кроме самого дорогого; на второго ребёнка — на весь итог.
// Кружки «за занятие» в итог не входят — отдельной строкой.
function programTotals(kidIdx) {
  const kid = program.kids[kidIdx];
  const lines = programLines(kid);
  const month = lines.filter(function (l) { return l.item.price.unit === 'month'; }).map(function (l) { return l.item.price.amount; });
  const sum = month.reduce(function (s, a) { return s + a; }, 0);
  let off = 0;
  const notes = [];
  if (DISCOUNTS.secondClub && month.length > 1) {
    const sorted = month.slice().sort(function (a, b) { return b - a; });
    const d = sorted.slice(1).reduce(function (s, a) { return s + Math.round(a * DISCOUNTS.secondClub / 100); }, 0);
    off += d;
    notes.push({ text: fill(t('discountClub'), { p: DISCOUNTS.secondClub }), amount: d });
  }
  if (DISCOUNTS.secondChild && kidIdx > 0 && sum - off > 0) {
    const d = Math.round((sum - off) * DISCOUNTS.secondChild / 100);
    off += d;
    notes.push({ text: fill(t('discountChild'), { p: DISCOUNTS.secondChild }), amount: d });
  }
  return { count: lines.length, sum: sum, total: sum - off, notes: notes,
    lessons: lines.filter(function (l) { return l.item.price.unit === 'lesson'; }) };
}

function slotsText(item, e) {
  const days = t('daysShort');
  return KDAYS.map(function (d, i) { return e.slots[d] ? days[i] + ' ' + e.slots[d] : ''; }).filter(Boolean).join(', ');
}

// Текст записи в WhatsApp на текущем языке
function programMessage() {
  const kid = curKid();
  const tot = programTotals(program.cur);
  const out = [fill(t('msgHello'), { center: company.name })];
  const name = kid.name.trim();
  if (name || kid.age) {
    const age = kid.age ? yearsText(kid.age) : '';
    out.push(name ? fill(t('msgChild'), { name: name, age: age }).replace(', .', '.') : fill(t('msgChildNoName'), { age: age }));
  }
  programLines(kid).forEach(function (l, i) {
    const g = (l.item.groups || []).length ? findGroup(l.item, l.e.g) : null;
    const parts = [];
    const times = slotsText(l.item, l.e);
    if (times) parts.push(times);
    parts.push(priceText(l.item));
    out.push(fill(t('msgLine'), { n: i + 1, name: loc(l.item.name) + (g ? ' (' + t('group') + ' ' + loc(g.name) + ')' : ''), details: parts.join(' — ') }));
  });
  if (TRIAL) out.push(t(kid.trial ? 'msgTrialYes' : 'msgTrialNo'));
  if (tot.sum) {
    out.push(fill(t('msgTotal'), { sum: formatAmount(tot.total) }));
    if (tot.notes.length) out.push(fill(t('msgDiscount'), { list: tot.notes.map(function (x) { return x.text; }).join(', ') }));
  }
  return out.join('\n');
}

// ─────────── Карточка кружка ───────────
// Выбранная группа и день — в памяти страницы (по ключу «направление/кружок»)
const kView = {};

function scheduleBlock(cat, item) {
  const key = cat.id + '/' + item.id;
  const st = kView[key] || (kView[key] = { g: groupFor(item, curKid().age, kAge), d: -1 });
  const box = el('section', 'ksec');
  const head = el('div', 'ksec-head');
  head.appendChild(el('h2', null, t('schedule')));
  box.appendChild(head);
  const sch = scheduleOf(item, st.g);
  const has = KDAYS.map(function (d) { return !!(sch[d] && sch[d].length); });
  if (!has.some(Boolean)) {
    box.appendChild(el('p', 'knote', t('noSchedule')));
    return box;
  }
  if ((item.groups || []).length > 1) {
    const gs = el('div', 'kgroups');
    gs.setAttribute('role', 'group');
    gs.setAttribute('aria-label', t('group'));
    item.groups.forEach(function (g) {
      const b = el('button', null, t('group') + ' ' + loc(g.name));
      b.type = 'button';
      b.setAttribute('aria-pressed', g.id === st.g ? 'true' : 'false');
      b.addEventListener('click', function () { st.g = g.id; st.d = -1; redraw(); });
      gs.appendChild(b);
    });
    box.appendChild(gs);
  }
  // День: выбранный, иначе сегодня (если в этот день есть занятия), иначе первый день с занятиями
  if (st.d < 0 || !has[st.d]) {
    const today = salonClock(new Date()).day - 1;
    st.d = has[today] && today < DAYS_SHOWN ? today : has.indexOf(true);
  }
  const days = el('div', 'kdays');
  days.style.setProperty('--n', DAYS_SHOWN);
  t('daysShort').slice(0, DAYS_SHOWN).forEach(function (name, i) {
    const b = el('button', has[i] ? 'has' : null, name);
    b.type = 'button';
    b.setAttribute('aria-pressed', i === st.d ? 'true' : 'false');
    b.addEventListener('click', function () { st.d = i; redraw(); });
    days.appendChild(b);
  });
  box.appendChild(days);
  const slots = el('div', 'kslots');
  slots.setAttribute('aria-live', 'polite');
  const list = sch[KDAYS[st.d]] || [];
  if (!list.length) slots.appendChild(el('p', 'knote', t('noClassDay')));
  list.forEach(function (s) {
    const r = el('div', 'kslot');
    r.appendChild(svgNode(ICONS.clock));
    r.appendChild(el('b', 'num', s));
    slots.appendChild(r);
  });
  box.appendChild(slots);
  if (company.scheduleNote) box.appendChild(el('p', 'knote', loc(company.scheduleNote)));
  return box;
}

  pic.appendChild(clubArt(cat, item, 'ill-hero draw'));
  if (item.hit) {
    const hit = el('span', 'khit');
    hit.appendChild(svgNode('<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' + starPath(12, 12.6, 11, 5) + '"/></svg>'));
    hit.appendChild(el('span', null, t('hit')));
    pic.appendChild(hit);
  }
  card.appendChild(pic);
  card.appendChild(el('h1', null, loc(item.name)));
  card.appendChild(el('p', 'kdirname', loc(cat.name)));
  const facts = el('div', 'kfacts');
  const fact = function (icon, text) {
    const f = el('span', 'kfact');
    f.innerHTML = kicon(icon);
    f.appendChild(el('span', null, text));
    facts.appendChild(f);
  };
  fact('user', ageText(item));
  if (item.duration) fact('clock', durText(item.duration));
  fact('cal', freqText(item));
  card.appendChild(facts);
  const price = el('div', 'kprice');
  const left = el('div');
  left.appendChild(el('p', 'price-big num', formatAmount(item.price.amount)));
  left.appendChild(el('p', 'per', t(item.price.unit === 'lesson' ? 'perLesson' : 'perMonth')));
  price.appendChild(left);
  const one = approxLesson(item);
  if (one) price.appendChild(el('p', 'one num', fill(t('approxLesson'), { price: formatAmount(one) })));
  card.appendChild(price);
  if (item.seats != null) card.appendChild(el('span', 'kdemo kseats', fill(t('seats'), { n: item.seats })));
  if (item.desc && loc(item.desc)) card.appendChild(el('p', 'kdesc', loc(item.desc)));
  card.appendChild(scheduleBlock(cat, item));
  if (item.teacher && loc(item.teacher.name)) {
    const tb = el('section', 'ksec');
    const th = el('div', 'ksec-head');
    th.appendChild(el('h2', null, t('teacher')));
    tb.appendChild(th);
    const row = el('div', 'kteacher');
    const ava = el('span', 'kava');
    ava.innerHTML = kicon('user');
    row.appendChild(ava);
    const b = el('div');
    b.appendChild(el('b', null, loc(item.teacher.name)));
    if (item.teacher.note) b.appendChild(el('small', null, loc(item.teacher.note)));
    row.appendChild(b);
    tb.appendChild(row);
    card.appendChild(tb);
  }
  screen.appendChild(card);

  // Нижняя панель: «Сынақ сабағы» (если пробное включено) и «Бағдарламаға қосу» / «Бағдарламада ✓»
  const bar = el('div', 'book-bar kbar');
  const inner = el('div', 'kbar-in');
  const two = el('div', TRIAL ? 'two' : 'two one');
  if (!TRIAL) two.style.gridTemplateColumns = '1fr';
  if (TRIAL) {
    const tr = externalLink('kbtn2', waLink(fill(t('msgTrialClub'), { name: loc(item.name) })));
    tr.textContent = t('trial');
    two.appendChild(tr);
  }
  if (inProgram(cat, item)) {
    const go = el('a', 'btn-book kadded');
    go.href = '#/program';
    go.textContent = t('added');
    two.appendChild(go);
  } else {
    const add = el('button', 'btn-book kaddbtn', t('add'));
    add.type = 'button';
    add.addEventListener('click', function () {
      const st = kView[cat.id + '/' + item.id];
      addToProgram(cat, item, st && st.g);
      redraw();
    });
    two.appendChild(add);
  }
  inner.appendChild(two);
  bar.appendChild(inner);
  app.appendChild(bar);
  document.title = loc(item.name) + ' · ' + company.name;
};

// ─────────── Экран «Программа ребёнка» #/program ───────────
function programItem(kid, l, i) {
  const box = stagger(el('div', 'kpc ' + tint(l.cat)), i);
  const top = el('div', 'kpc-top');
  top.appendChild(clubArt(l.cat, l.item, 'ill-mini'));
  const g = el('div', 'grow');
  const name = el('a', null);
  name.href = itemHash(l.cat, l.item);
  name.appendChild(el('b', null, loc(l.item.name)));
  g.appendChild(name);
  g.appendChild(el('small', null, ageText(l.item) + ' · ' + freqText(l.item) + (kid.age && !fitsAge(l.item, kid.age) ? ' · ' + t('notForAge') : '')));
  top.appendChild(g);
  top.appendChild(el('span', 'pr num', priceText(l.item)));
  const del = el('button', 'kdel');
  del.type = 'button';
  del.setAttribute('aria-label', t('remove') + ': ' + loc(l.item.name));
  del.title = t('remove');
  del.appendChild(svgNode(ICONS.trash));
  del.addEventListener('click', function () {
    kid.items.splice(kid.items.indexOf(l.e), 1);
    saveProgram();
    redraw();
  });
  top.appendChild(del);
  box.appendChild(top);
  if ((l.item.groups || []).length > 1) {
    const gs = el('div', 'kgroups');
    gs.setAttribute('role', 'group');
    gs.setAttribute('aria-label', t('group'));
    l.item.groups.forEach(function (gr) {
      const b = el('button', null, t('group') + ' ' + loc(gr.name));
      b.type = 'button';
      b.setAttribute('aria-pressed', gr.id === l.e.g ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (l.e.g === gr.id) return;
        l.e.g = gr.id;
        l.e.slots = defaultSlots(l.item, gr.id);
        saveProgram();
        redraw();
      });
      gs.appendChild(b);
    });
    box.appendChild(gs);
  }
  // Время по дням: «—» — в этот день не ходит
  const sch = scheduleOf(l.item, l.e.g);
  const days = KDAYS.filter(function (d) { return sch[d] && sch[d].length; });
  if (days.length) {
    const grid = el('div', 'ktimes');
    days.forEach(function (d) {
      const lab = el('label');
      lab.appendChild(el('span', null, t('daysShort')[KDAYS.indexOf(d)]));
      const sel = el('select');
      sel.setAttribute('aria-label', loc(l.item.name) + ', ' + t('daysShort')[KDAYS.indexOf(d)]);
      [''].concat(sch[d]).forEach(function (s) {
        const o = el('option', null, s || t('dayNone'));
        o.value = s;
        if ((l.e.slots[d] || '') === s) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        if (sel.value) l.e.slots[d] = sel.value; else delete l.e.slots[d];
        saveProgram();
        redraw();
      });
      lab.appendChild(sel);
      grid.appendChild(lab);
    });
    box.appendChild(grid);
    const n = Object.keys(l.e.slots).length;
    if (l.item.perWeek > 0 && n !== l.item.perWeek) box.appendChild(el('p', 'knote', fill(t('perWeekNote'), { times: timesText(l.item.perWeek) })));
  } else box.appendChild(el('p', 'knote', t('noSchedule')));
  return box;
}

function weekGrid(lines) {
  const box = el('div', 'kweek');
  const days = t('daysShort').slice(0, DAYS_SHOWN);
  const head = el('div', 'kwrow');
  head.style.setProperty('--n', DAYS_SHOWN);
  head.appendChild(el('span'));
  let lessons = 0;
  days.forEach(function (name, i) {
    const busy = lines.some(function (l) { return l.e.slots[KDAYS[i]]; });
    head.appendChild(el('span', 'kwh' + (busy ? ' busy' : ''), name));
  });
  box.appendChild(head);
  lines.forEach(function (l) {
    const row = el('div', 'kwrow ' + tint(l.cat));
    row.style.setProperty('--n', DAYS_SHOWN);
    row.appendChild(el('span', 'kwn', loc(l.item.name)));
    days.forEach(function (name, i) {
      const s = l.e.slots[KDAYS[i]];
      if (s) lessons++;
      row.appendChild(el('span', 'kwc num' + (s ? ' on' : ''), s ? slotStart(s) : ''));
    });
    box.appendChild(row);
  });
  return { box: box, lessons: lessons };
}

function renderProgram(screen, app) {
  screen.classList.add('screen-item', 'kids-item', 'kids', 'kprog');
  screen.appendChild(backLink('#/', 'home', t('home')));
  screen.appendChild(el('h1', null, t('program')));
  const kid = curKid();

  // Дети: вкладки и «Тағы бір бала»
  const tabs = el('div', 'kkids');
  tabs.setAttribute('role', 'group');
  program.kids.forEach(function (k, i) {
    const b = el('button', 'num', k.name.trim() || t('child') + ' ' + (i + 1));
    b.type = 'button';
    b.setAttribute('aria-pressed', i === program.cur ? 'true' : 'false');
    b.addEventListener('click', function () { program.cur = i; saveProgram(); redraw(); });
    tabs.appendChild(b);
  });
  if (program.kids.length < KIDS_MAX) {
    const add = el('button', 'kadd', '+ ' + t('anotherChild'));
    add.type = 'button';
    add.addEventListener('click', function () {
      program.kids.push(newKid());
      program.cur = program.kids.length - 1;
      saveProgram();
      redraw();
    });
    tabs.appendChild(add);
  }
  screen.appendChild(tabs);

  // Ребёнок: имя и возраст
  const card = el('div', 'kkid');
  const nameLab = el('label', 'kfield');
  nameLab.appendChild(el('span', null, t('childName')));
  const name = el('input');
  name.type = 'text';
  name.maxLength = 40;
  name.autocomplete = 'off';
  name.placeholder = t('childNameHint');
  name.value = kid.name;
  name.addEventListener('input', function () {
    kid.name = name.value;
    saveProgram();
    const tab = tabs.querySelectorAll('button')[program.cur];
    if (tab) tab.textContent = kid.name.trim() || t('child') + ' ' + (program.cur + 1);
    const wa = document.querySelector('.kbar .kenroll');
    if (wa) wa.href = waLink(programMessage());
  });
  nameLab.appendChild(name);
  card.appendChild(nameLab);
  const ageLab = el('label', 'kfield');
  ageLab.appendChild(el('span', null, t('childAge')));
  const age = el('select');
  for (let y = 0; y <= 16; y++) {
    if (y === 1) y = 2;
    const o = el('option', 'num', y ? String(y) : t('ageNone'));
    o.value = String(y);
    if (kid.age === y) o.selected = true;
    age.appendChild(o);
  }
  age.addEventListener('change', function () { kid.age = parseInt(age.value, 10) || 0; saveProgram(); redraw(); });
  ageLab.appendChild(age);
  card.appendChild(ageLab);
  screen.appendChild(card);
  if (program.kids.length > 1) {
    const rm = el('button', 'krmkid', t('removeChild'));
    rm.type = 'button';
    rm.addEventListener('click', function () {
      program.kids.splice(program.cur, 1);
      program.cur = Math.max(0, program.cur - 1);
      saveProgram();
      redraw();
    });
    screen.appendChild(rm);
  }

  const lines = programLines(kid);
  if (!lines.length) {
    const empty = el('div', 'kprog-empty');
    empty.appendChild(el('p', null, t('programEmpty')));
    const go = el('a', 'kbtn');
    go.href = '#/';
    go.textContent = t('toClubs');
    empty.appendChild(go);
    screen.appendChild(empty);
    document.title = t('program') + ' · ' + company.name;
    return;
  }
  const chosen = el('section', 'ksec');
  const ch = el('div', 'ksec-head');
  ch.appendChild(el('h2', null, t('chosen')));
  chosen.appendChild(ch);
  const list = el('div', 'kplist');
  lines.forEach(function (l, i) { list.appendChild(programItem(kid, l, i)); });
  chosen.appendChild(list);
  screen.appendChild(chosen);

  const week = el('section', 'ksec');
  const wh = el('div', 'ksec-head');
  wh.appendChild(el('h2', null, t('weekTitle')));
  week.appendChild(wh);
  const wg = weekGrid(lines);
  week.appendChild(wg.box);
  week.appendChild(el('p', 'knote', fill(t('weekBusy'), { n: wg.lessons })));
  screen.appendChild(week);

  const tot = programTotals(program.cur);
  const total = el('div', 'ktotal');
  const ln = el('div', 'ln');
  ln.appendChild(el('span', null, t('total')));
  ln.appendChild(el('b', 'num', formatAmount(tot.total)));
  total.appendChild(ln);
  tot.notes.forEach(function (x) {
    const r = el('div', 'ln sm');
    r.appendChild(el('span', null, x.text));
    r.appendChild(el('b', 'num', MINUS + formatAmount(x.amount)));
    total.appendChild(r);
  });
  if (tot.lessons.length) {
    total.appendChild(el('p', 'knote', fill(t('totalLessons'), {
      list: tot.lessons.map(function (l) { return loc(l.item.name) + ' ' + priceText(l.item); }).join(', ')
    })));
  }
  screen.appendChild(total);
  if (TRIAL) {
    const lab = el('label', 'kcheck');
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = kid.trial;
    cb.addEventListener('change', function () {
      kid.trial = cb.checked;
      saveProgram();
      const wa = document.querySelector('.kbar .kenroll');
      if (wa) wa.href = waLink(programMessage());
    });
    lab.appendChild(cb);
    lab.appendChild(el('span', null, t('wantTrial')));
    screen.appendChild(lab);
  }

  const bar = el('div', 'book-bar kbar');
  const inner = el('div', 'kbar-in');
  const wa = externalLink('btn-book one-btn kenroll', waLink(programMessage()));
  wa.appendChild(svgNode(ICONS.whatsapp));
  wa.appendChild(el('span', null, t('enroll')));
  inner.appendChild(wa);
  bar.appendChild(inner);
  app.appendChild(bar);
  document.title = t('program') + ' · ' + company.name;
}

// ─────────── Маршруты и нижняя панель ───────────
const parseRouteSalon = parseRoute;
parseRoute = function (hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts.length === 1 && parts[0] === 'program') return { screen: 'program', key: 'program' };
  if (parts.length === 1 && parts[0] === 'adult') return { screen: 'adult', key: 'adult' };
  return parseRouteSalon(hash);
};

// render() рисует неизвестный ему экран как главную — здесь вместо неё программа или «Ересектерге»
renderHome = function (screen) {
  const s = currentRoute && currentRoute.screen;
  if (s === 'program') renderProgram(screen, document.getElementById('app'));
  else if (s === 'adult') renderAdult(screen);
  else renderKidsHome(screen);
};

// Панель «Баланың бағдарламасы: 2 үйірме · 45 000 ₸/ай — Ашу ›» на главной, в направлении и «Ересектерге»
const renderSalon = render;
render = function (route, direction) {
  renderSalon(route, direction);
  if (route.screen !== 'home' && route.screen !== 'cat' && route.screen !== 'adult') return;
  const tot = programTotals(program.cur);
  if (!tot.count) return;
  const app = document.getElementById('app');
  app.querySelector('.screen').classList.add('has-kbar');
  const bar = el('div', 'book-bar kbar');
  if (!direction) bar.style.animation = 'none';
  const inner = el('div', 'kbar-in');
  const g = el('div', 'grow');
  g.appendChild(el('b', null, t('program')));
  g.appendChild(el('span', 'num', fill(t('bar'), { count: clubsCount(tot.count), sum: formatAmount(tot.total) + t('monthShort') })));
  inner.appendChild(g);
  const go = el('a', 'kgo');
  go.href = '#/program';
  go.appendChild(el('span', null, t('open')));
  go.appendChild(svgNode(ICONS.chev));
  inner.appendChild(go);
  bar.appendChild(inner);
  app.appendChild(bar);
};

// Заголовок панели режима работы: «Жұмыс уақыты» (слово «Кесте» у детского центра — расписание кружка)
const fillHoursPanelSalon = fillHoursPanel;
fillHoursPanel = function (panel, date) {
  fillHoursPanelSalon(panel, date);
  if (panel.firstChild) panel.firstChild.textContent = t('hoursTitle');
};

init();
</script>
